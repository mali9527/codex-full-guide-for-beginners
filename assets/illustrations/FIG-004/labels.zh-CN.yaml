title: Windows文件夹窗口里，怎样确认选中的目录？
caption: Windows日文选择器的下部：先核对「フォルダー」一栏，再按「フォルダーの選択」确认。中文系统的对应动作是选择文件夹。
alt: 放大选择器下部两行：上行左フォルダー:、右长字段空白；下一行右侧并排フォルダーの選択与キャンセル按钮。中文「核对所选目录」在上方箭头指空字段；中文「选择文件夹」在下方箭头指左按钮。全部黑灰手绘，不复制红框，不增加目录名称。
labels:
  folder: 'フォルダー:'
  select: フォルダーの選択
  cancel: キャンセル
  note: 核对所选目录
  confirm: 选择文件夹
