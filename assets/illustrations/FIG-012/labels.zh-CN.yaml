title: 三种批准模式在菜单中怎样区分？
caption: 日文界面的三种模式与本书称呼对照。图中的勾选只是来源状态，初次使用按正文先选请求批准；别把帮我批准理解为取消所有确认。
alt: 纵向放大真实三行菜单，第一行承認を求める，第二行代わりに承認，第三行フルアクセス，勾选只在第二行最右。省略菜单标题及各行帮助长句。菜单外右侧中文「请求批准」「帮我批准」「完全访问」各用细线对齐对应行。不要将中文放入软件菜单，不画未查看的设置页面，不增加标题。
labels:
  ask: 承認を求める
  auto: 代わりに承認
  full: フルアクセス
  a: 请求批准
  b: 帮我批准
  c: 完全访问
