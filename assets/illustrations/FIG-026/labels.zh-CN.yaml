title: 创建定时任务时要核对什么？
caption: 创建表单依次核对名称（Name）、项目（Projects）、每次要求（Prompt）和时间（Schedule）。看到这张表单还不等于保存成功，完成创建后仍要到Scheduled核对实际安排。
alt: 定时任务创建表单依次包含Name、Projects、Prompt和Schedule，右下是Create；中文说明对应名称、项目、每次要求和时间。
