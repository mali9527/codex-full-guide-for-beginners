title: 追加消息是排到下一轮，还是影响当前工作？
caption: 中文设置中的排队对应Queue，引导对应Steer。发出补充前先看默认行为；要求改变当前方向时，别让消息留在下一轮队列中。
alt: 画设置单行局部，左跟进行为，右两项分段选择排队、引导；只在排队下画轻微灰线表示来源选中。省略整段帮助文字与其他设置。下方中文作者说明「Queue：下一轮」细箭头指排队，「Steer：当前运行」细箭头指引导。英文仅属作者圈注，不放入菜单。不要画队列消息或成功停止状态。
labels:
  follow: 跟进行为
  queue: 排队
  steer: 引导
  q: Queue：下一轮
  s: Steer：当前运行
