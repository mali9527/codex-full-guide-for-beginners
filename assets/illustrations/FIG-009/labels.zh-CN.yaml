title: Windows第一屏，先看哪几个地方？
caption: Windows日文起始画面的主要区域：侧栏找任务，输入框上方选项目，下方写要求。图中省略了与本章无关的推荐卡片。
alt: 真实Windows窗口的左右结构，左侧窄栏上方新しいチャット，中段プロジェクト，其他条目用无字短线简化。右侧工作区上部留白，底部先项目条プロジェクトを選択，其下宽输入框只显示上半部，底部用自然截断边线表示局部。作者中文「找到任务」箭头指左侧新しいチャット，「先选项目」箭头指项目条，「填写要求」箭头指下方输入框。不得补造底部按钮、模型、旧提示卡片或标题。
