composition: 保留真实图的左窄侧栏、右宽主区域与下方输入区。侧栏从上到下New chat、Scheduled、Plugins、Projects；中间项目名和任务名省略留空，不替换成自编案例。右侧上部留白，右下方Choose
  project在Do anything输入框上方。省略Full access、模型、麦克风、头像、推荐案例与中央口号。作者圈注找工作指向左侧栏，提要求指向右下输入框。不是Mac独有，也不声称Windows独有；不要添加任何操作系统窗口按钮。
content_guard: 固定1448×1086不透明细方格纸，黑色中性笔，全部RGB通道严格相等。只出现labels文字，不出现title、caption或alt；原案例、头像、颜色、未知窗口按钮一律不画。
