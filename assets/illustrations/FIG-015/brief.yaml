kind: interface
form: overview
reader_question: 文件入口和预览区域分别在哪里？
takeaway: 左侧文件卡片提供打开入口，右侧用于查看内容。
source_sections:
- 预览让检查更方便
placement: 预览让检查更方便
composition: 按真实图相对位置绘制左右两个区域。左侧简化为一个横向文件卡片，output.pptx居左，Open按钮居右；右侧较大预览面板，上方标签output.pptx，面板中仅画空白页面与左侧窄缩略页轮廓，省略原PPT全部内容。上方中文圈注文件入口指向左侧文件名，预览区域指向右侧面板。只画这两个区域，不重造完整窗口、任务对话、路径、型号、批注、工具栏或菜单。省略部分留白，不增加结构连接箭头。
content_guard: 严格黑白中性灰，R=G=B，1448×1086固定母版。只画已观察的两个局部关系，不拷贝来源演示内容；不得补造批注控件。无额外标题和图注。
