composition: 单一局部：Source folders标题在列表上方；列表上行左侧文件夹图标和Documents、右侧叉号；下行左侧文件夹加号图标和Add
  folder。严格保持上下顺序，局部外不画完整窗口、项目名和底部按钮。右侧两条独立黑笔圈注分别指向上行与下行。标题、图注不画进图里。
content_guard: notebook-pen-v1固定方格纸黑笔，1448×1086不透明纯中性灰。来源为Take Toucan发布的Mac创建项目图片，版本未知；只重绘实际看到的Source
  folders局部，不声称是Edit project窗口或当前双平台实测。保留Documents原示例名，不替换为我的待办；不复制专属项目名、例文、配色和外围装饰。不要补画路径、Make
  primary、Local或点击后状态。
