composition: 原比例放大单个请求框：Computer Use在左上，下一行Allow Codex to use Calculator?；框底左侧未勾选的Always
  allow，右侧Cancel在Allow左边。不要画快捷键、旧型号或整窗。上方作者文字先核对应用指向Calculator，下方作者文字再决定是否允许指向右侧两个按钮；两支箭头分开不遮文字。Calculator保留原UI名称，不改成书中自编清单软件。
