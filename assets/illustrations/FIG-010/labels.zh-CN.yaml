title: 剩余用量与重置时间怎样一起读？
caption: 历史Mac用量页面的字段读法：left是剩余，Resets是重置时间，五小时与每周是不同范围。100%和62%只保留来源当时的显示，请以自己账号当前页面为准。
alt: 用量卡片按五小时和每周分两行，分别显示剩余比例与重置时间；图中100%和62%是来源图片的历史数值。
labels:
  five: 5 hour usage limit
  weekly: Weekly usage limit
  a: 100% left
  b: 62% left
  r1: Resets 2:28 AM
  r2: Resets May 19
  period: 看时间范围
  left: 看剩余比例
  reset: 看重置时间
