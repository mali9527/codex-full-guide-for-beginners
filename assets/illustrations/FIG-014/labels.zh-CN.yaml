title: 快照会送到哪个任务？
caption: Windows繁体界面中的Appshot目的地：自動、目前對話和新對話决定快照进入哪里。图中勾选仅为来源状态；用于同一件事时，先确认接收任务。
alt: 放大真实图片左侧目的地局部。上行左为Appshot 目的地，右为自動下拉框。其下菜单按自動、目前對話、新對話纵向排列，勾选自動。省略原帮助长句、快捷键行、右侧照片及其他设置。中文圈注「先确认接收任务」箭头只指Appshot
  目的地。
labels:
  destination: Appshot 目的地
  auto: 自動
  current: 目前對話
  new: 新對話
  note: 先确认接收任务
