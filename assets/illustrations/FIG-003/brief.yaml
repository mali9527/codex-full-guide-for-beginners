composition: 依据真实Mac选择器画简单窗口：窄左侧栏用文件夹图标和无字灰线，右侧目录列表用三行无字线与文件夹图标，顶部地址区用无字横线代替。右下并排Cancel、Open。中文「确认文件夹」箭头指Open；其上中文「先核对位置」箭头指顶部地址区。不要画来源专有路径或自创文件夹名，不画已连接结果，无额外标题。
