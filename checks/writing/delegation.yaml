    checked_on: '2026-09-29'
    understanding: 本地Codex在直接请求或适用的项目、技能说明下才使用子代理，Ultra可主动分工；桌面可从主任务的活动进入各子代理线程；可直接请Codex引导或停止子代理；子代理流程比单代理消耗更多token；读多的工作适合并行，写多的要防冲突。
    teaching_use: 从只读检查开始；补一句停止某个子代理可以直接向主任务提出。
  teaching_sequence:
  - 先分清两种分工→从只读检查开始的请求
  - 看活动与返回内容→改文件时由主任务合稿
  - 成本与判断→回到证据
  defer:
  - 自定义代理配置不教
  case_plan: 沿用资料目录结果，两个只读检查角度为本书自设。
