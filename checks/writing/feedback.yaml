  - 先确认评价的是哪一版
  - 纠错与更新不同
  - AI互审不是独立证据
  official_readings:
  - fact_id: review-feedback-command-purpose
    url: https://learn.chatgpt.com/docs/reference/slash-commands
    locator: /review与/feedback
    checked_on: '2026-09-28'
    understanding: /review启动代码审查模式；/feedback提交产品反馈并可附日志。
    teaching_use: 放在章末澄清，普通成果审阅直接发消息。
  - fact_id: task-materials-and-output
    url: https://learn.chatgpt.com/docs/prompting
    locator: Improve the result with follow-up messages
    checked_on: '2026-09-29'
    understanding: 请求具体改动而不是重来。
    teaching_use: 四类反馈各给一个带依据的示例。
  teaching_sequence:
  - 确认当前版本→事实错了给依据
  - 表达不合适说使用困难→新进展说明是新信息
  - 指出正确部分→让它检查但看证据→两个命令的用途
  defer:
  - 批注操作已在第10章
  case_plan: 沿用按状态分组的清单与自设的漏数量、截止时间难找两种情形。
