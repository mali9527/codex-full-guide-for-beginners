  reader_goal: 能在当前任务找到模型控件，读懂Power预设与Advanced，按任务需要选模型与Effort，知道Max、Ultra、Fast各改变什么。
  reader_start:
  - 已会查看用量；在第4章用过模型控件。
  explain_now:
  - 先分清是材料没读到还是判断没做好
  - Power预设是什么
  - Effort不是回答长度
  - Fast换的是速度与用量
  official_readings:
  - fact_id: gpt6-model-use-position
    url: https://learn.chatgpt.com/docs/models
    locator: Recommended models / GPT-6.1 Sol / Pick a reasoning effort
    checked_on: '2026-10-04'
    understanding: 模型建议随型号变化；示例控件默认不代表每个账号。Astra开篇保留，补6.1 Sol可用条件。
    teaching_use: 表格只作任务起点；操作从当前可用设置开始，不把旧Sol Medium强加给新版。
  - fact_id: fast-mode-choice
    url: https://learn.chatgpt.com/docs/agent-configuration/speed
    locator: Fast mode
    checked_on: '2026-10-04'
    understanding: 内含额度与另购credits倍率不同，都不是任务提速倍率。
    teaching_use: 纠正原文统一credits2.5倍，解释两种消耗口径，不展开购买建议。
  teaching_sequence:
  - 找到当前任务控件→读Power预设→需要时进Advanced→核对显示
  - 按工作需要的判断选模型→Effort含义与起步建议→Max与Ultra
  - Fast与/fast→用具体问题决定是否调整
  - 沿用原讲解顺序；Power示例与实际默认分开，6.1 Sol从可用默认开始，Fast按用量来源区分。
  defer:
  - 子代理分工留第18章
  - 额度读法已在第5章
  case_plan: 沿用漏掉「选10张」与周五前发照片的更新两例，均为自设情景。
