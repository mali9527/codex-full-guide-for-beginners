  base_manuscript_sha256: bd1c0140f7002e2e692a4946e781a56fdd5a712151b5103b129c35af9da75ae4
  reader_goal: 能在当前任务找到模型控件，读懂Power预设与Advanced，按任务需要选模型与Effort，知道Max、Ultra、Fast各改变什么。
  reader_start:
  - 已会查看用量；在第4章用过模型控件。
  explain_now:
  - 先分清是材料没读到还是判断没做好
  - Power预设是什么
  - Effort不是回答长度
  - Fast换的是速度与用量
  official_readings:
  - fact_id: reasoning-default-guidance
    url: https://learn.chatgpt.com/docs/models
    locator: Power presets；Advanced；起步建议；Max与Ultra
    checked_on: '2026-09-29'
    understanding: 六个Power预设依次为Luna High、Sol Light、Sol Medium、Astra Light、Astra Medium、Astra
      Extra High；Advanced可分选模型、推理投入和速度；Max加深单任务推理，Ultra用子代理并行，Luna不支持Ultra。
    teaching_use: 补一段解释预设把型号和档位组合在一起，列出官方当前给出的六个组合，说明以自己看到的为准。
  - fact_id: fast-mode-choice
    url: https://learn.chatgpt.com/docs/agent-configuration/speed
    locator: 速率说明
    checked_on: '2026-09-29'
    understanding: Astra、Sol、Luna的Fast按Standard的2.5倍计credits；用ChatGPT登录时在桌面、CLI和扩展可用。
    teaching_use: 保留倍率，强调它描述用量而非整项任务的提速比例。
  - fact_id: gpt6-model-use-position
    url: https://learn.chatgpt.com/docs/model-selection
    locator: 比较建议
    checked_on: '2026-09-29'
    understanding: 用相同输入比较，保留满足质量要求的最轻设置。
    teaching_use: 结尾落在用结果决定是否调整。
  teaching_sequence:
  - 找到当前任务控件→读Power预设→需要时进Advanced→核对显示
  - 按工作需要的判断选模型→Effort含义与起步建议→Max与Ultra
  - Fast与/fast→用具体问题决定是否调整
  defer:
  - 子代理分工留第18章
  - 额度读法已在第5章
  case_plan: 沿用漏掉「选10张」与周五前发照片的更新两例，均为自设情景。
