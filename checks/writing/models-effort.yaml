  concept_timing:
    result: pass
    reason: Effort先讲作用再档位；Ultra只解释分工特点，完整操作留第18章但不要求现在开。 全书衔接复核：全文回读：实际选择入口在分析档位之前；Light/Medium/High是三型号建议起点，不是统一默认。Ultra分工在第18章已展开，不将语义上提高投入等同资料核验。
  information_value:
    result: pass
    reason: 保留起点与误区，删参数/购买表；材料错误与设置问题分开。
