    locator: Start; Define done; Steer
    checked_on: '2026-09-29'
    understanding: 目标文字是要求也是完成标准，不改变权限。
    teaching_use: 先具备原创材料和明确输出，再/goal，按进度行暂停/编辑/恢复/清除。
  - fact_id: desktop-remote-host
    url: https://learn.chatgpt.com/docs/remote
    locator: Get started with Remote
    checked_on: '2026-09-29'
    understanding: 手机操作连接电脑而非自动云端运行；同账号、工作区与在线条件。
    teaching_use: 可选路径完整简述，离线暂停、恢复后核对文件。
  teaching_sequence:
  - 取得原创目录包→打开本地文件夹→只读确认4文件→明确12条核对标准→/goal设置目标→看进度行
  - 需要改变范围先暂停→编辑目标核对→恢复→检查3份实际文件→无后续时清除目标；不等于恢复文件
  defer:
