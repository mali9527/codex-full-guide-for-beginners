    url: https://learn.chatgpt.com/docs/plugins
    locator: 安装、连接、调用与卸载
    checked_on: '2026-09-28'
    understanding: 在Plugins中打开详情点加号安装，按提示连接外部服务，再开新任务使用；可自动、用@点名插件或用$调用其技能；卸载用Uninstall
      plugin。
    teaching_use: 主流程写清安装后新开任务这一步。
  - fact_id: desktop-mcp-status-and-connection
    url: https://learn.chatgpt.com/docs/extend/mcp
    locator: Settings > MCP servers与/mcp
    checked_on: '2026-09-29'
    understanding: 设置页可添加服务器、显示启用与认证状态；传输分本地进程与服务地址两类；/mcp查看已连接服务器；本地配置与网页端分开。
    teaching_use: 直接添加服务器只作可信服务的备选说明。
  teaching_sequence:
  - 插件提供什么→MCP一句话
  - 从只读需要开始：找插件→看详情→安装→连接→新任务调用→到原服务核对
  - 五种状态表→/mcp与设置页→动作边界→关闭与卸载
  defer:
  - 浏览器扩展留第22章
  case_plan: 自设情景：读取文档服务中一份无敏感信息的测试文档的标题和第一段；不指定服务商。
