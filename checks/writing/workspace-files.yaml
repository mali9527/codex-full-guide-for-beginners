study_review:
  result: pass
  reason: 对971b718正文与56047b6写前提要核对：Projects中的本地目录/主要文件夹与Commands的入口落实为先连接再发送；Local解释随当前任务核对，不把项目当权限。
reader_review:
  prior_knowledge:
    result: pass
    reason: 读者会文件夹常识，但不懂项目与路径；在第一条消息前解释二者关系、选择哪层、核对哪处。无需编程项目。
  concept_timing:
    result: pass
    reason: 认识侧栏→实际打开文件夹→核对路径/Local→短消息→周围控件；Make primary仅为已有多文件夹时的条件分支。
  information_value:
    result: pass
    reason: 补齐Open folder与Edit project/Add folder两种入口；动作名称、默认键和找命令方式各有用途。第4章不重复整段准备。
  natural_style:
    result: pass
    reason: 材料沿用我的待办，随后短提醒明确只回复文字；文件准备不是提前执行文件任务，两个阶段交代清楚。
  localization:
    result: pass
    reason: 双平台路径明确demo为示例；快捷键按平台写出，Make primary保持真实名称并用主要文件夹解释，不猜汉化。
  independent_creation:
    result: pass
    reason: 项目用途按读者问题独立重组；沿用原创两备忘和水杯短请求，无官方多仓库/Quick chat/CLI案例或表达结构搬用。
