study_brief:
  mode: revision
  prepared_on: '2026-09-29'
  base_manuscript_sha256: 38d79af3426bbf35bee4d213e1b458ee61e256d595ebc560374a6db8e0aba83c
  reader_goal: 读者能看懂第一屏区域和常用入口，发出简短请求、判断回复并继续改一处。
  reader_start:
  - 已能进入Codex，尚未连接材料文件夹；Astra开篇给过模型与工具概念。
  explain_now:
  - 常驻聊天区域与按需工作面板
  - 任务与项目、聊天原文与当前材料
  - 附件/@/$/斜线菜单的不同用途
  - 听写与实时语音
  - 模型Effort速度权限运行位置各管什么
  official_readings:
  - fact_id: desktop-basic-navigation
    url: https://learn.chatgpt.com/docs/reference/commands
    locator: macOS/Windows General、Chats、Input、Workspace
    checked_on: '2026-09-29'
    understanding: 命令菜单和快捷键能帮助找入口，默认键位可能被改。
    teaching_use: 给按钮优先路径及少量必要替代，面板不讲成必见。
  - fact_id: desktop-voice-options
    url: https://learn.chatgpt.com/docs/prompting
    locator: Use voice dictation
    checked_on: '2026-09-29'
    understanding: 听写生成草稿可先改再发。
    teaching_use: 就地用现有三条提醒说明，实时对话后置。
  - fact_id: desktop-voice-options
    url: https://learn.chatgpt.com/docs/features/voice
    locator: Voice and dictation；Availability
    checked_on: '2026-09-29'
    understanding: 实时语音和听写不同，既有任务语音逐步开放。
    teaching_use: 只解释区别，不强制开启新功能。
  - fact_id: task-materials-and-output
    url: https://learn.chatgpt.com/docs/use-chatgpt
    locator: Attach files；Compare Work and Codex
    checked_on: '2026-09-29'
    understanding: 文件/图片可作为材料，访问电脑另需目录。
    teaching_use: 附件和@讲对象用途，不等同所有文件可见。
  - fact_id: desktop-slash-entries
    url: https://learn.chatgpt.com/docs/reference/slash-commands
    locator: Use a slash command；Available commands
    checked_on: '2026-09-29'
    understanding: 斜线是功能入口，$是技能，/status可在当前环境查状态。
    teaching_use: 菜单可用项为准，不背命令。
  - fact_id: reasoning-default-guidance
    url: https://learn.chatgpt.com/docs/models
    locator: Power / Advanced；Effort
    checked_on: '2026-09-29'
    understanding: 预设组合与精确选择不同。
    teaching_use: 控件解释服务初次判断，详细设置留第6章。
  - fact_id: fast-mode-choice
    url: https://learn.chatgpt.com/docs/agent-configuration/speed
    locator: Fast mode
    checked_on: '2026-09-29'
    understanding: 速度与推理不同，会增加消耗。
    teaching_use: 一段说明用途和默认起步即可。
  - fact_id: permission-modes-enablement
    url: https://learn.chatgpt.com/docs/permission-modes
    locator: Enable modes；How permissions work
    checked_on: '2026-09-29'
    understanding: 自动审核不是批注文稿，启用不等于选中。
    teaching_use: 初见易混处一句讲清，完整批准留第7章。
  - fact_id: plugin-install-connection
    url: https://learn.chatgpt.com/docs/plugins
    locator: Overview；Use and install
    checked_on: '2026-09-29'
    understanding: 安装扩展与连接服务不同。
    teaching_use: Plugins先定位用途，首例不依赖安装。
  - fact_id: scheduled-chat-destination
    url: https://learn.chatgpt.com/docs/automations
    locator: Manage scheduled tasks
    checked_on: '2026-09-29'
    understanding: Scheduled是结果与日程入口。
    teaching_use: 先认识入口，本地运行条件就地说明。
  teaching_sequence:
  - 先给区域方位并找到新任务
  - 用三条提醒发送和改顺序
  - 结合已发生的交流解释状态
  - 材料与听写入口
  - 模型/权限及运行位置、插件定时设置去向
  - 预览与面板、回到任务
  defer:
  - 全量命令表
  - 所有权限和Effort档位的选择教程
  - 语音屏幕上下文
  - MCP配置和Git审查
  case_plan: 保留本书原创水杯/还书三条提醒，两轮回复只给语义预期。语音可选且发送前改文字；界面不凭空断言布局和中文标签。
