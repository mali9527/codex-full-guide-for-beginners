  base_manuscript_sha256: b2674818f5f2b8372e1be668bcedbc3052d06b1329170e57490ccbeddd9b40b8
  reader_goal: 在正确项目准备好首次任务，选必要设置后发消息，知道何时等待、何时回应、何时发送下一条。
  reader_start:
  - 已按第2章安装、登录并进入Codex；没有要求读者已创建任务或完成Windows沙箱。
  - 会下载/解压，但项目连接、路径、Local、权限和运行状态尚未学过。
  explain_now:
  - Open folder与Add folder是替代入口
  - 先核对项目目录，再开始一次新任务并选Local
  - 发送前选择Ask for approval并确认模型可用
  - 第一次发送→识别运行/等待→完成后检查→在同一任务继续
  official_readings:
  - fact_id: desktop-basic-navigation
    url: https://learn.chatgpt.com/docs/reference/commands
    locator: macOS/Windows General / Chats / Input
    checked_on: '2026-09-29'
    understanding: 默认键和应用入口是找位置的帮助，New chat不应在相邻段反复执行。
    teaching_use: 据当前操作依赖重排，具体顺序见teaching_sequence；无新GUI实测。
  - fact_id: permission-boundary
    url: https://learn.chatgpt.com/docs/permission-modes
    locator: Permission modes / How permissions work
    checked_on: '2026-09-29'
    understanding: 权限控件在输入框下方；应先选再发，不把名称介绍当已经完成设置。
    teaching_use: 据当前操作依赖重排，具体顺序见teaching_sequence；无新GUI实测。
  - fact_id: desktop-model-control
    url: https://learn.chatgpt.com/docs/models
    locator: Choose a model / Power / Advanced
    checked_on: '2026-09-29'
    understanding: 有可用模型即可首次发送，Power默认起点与主动Advanced调整分开。
    teaching_use: 据当前操作依赖重排，具体顺序见teaching_sequence；无新GUI实测。
  - fact_id: desktop-followup-behavior
    url: https://learn.chatgpt.com/docs/prompting
    locator: Prompting overview / Steering and queuing
    checked_on: '2026-09-29'
    understanding: 后续消息可能进入当前轮或队列；首例先等结束再发，不能默认即时替换。
    teaching_use: 据当前操作依赖重排，具体顺序见teaching_sequence；无新GUI实测。
  teaching_sequence:
  - 材料已解压→Open folder选择外层→Edit project核对路径；已有项目只需另一条Add folder分支
  - 目录正确→New chat一次→核对项目/Local与权限，模型保留可用起点→可发送第一条
  - 短要求发送→看运行/补问/批准/失败→等本轮结束核对两事项→在同一任务调整顺序
  - 完整结果之后再看附件、听写和详细控件；这些预览不当作首次任务必做
  defer:
  - 后续章节的完整档位策略、队列控制与高级项目管理
  - 正在运行时停止入口尚无双平台真实依据；本轮未找到可确认桌面普通任务停止键的文档，保留原操作清单缺口，不移植CLI或猜按钮。
  case_plan: 保留两份短备忘、四项待办和v1/v2；第3章水杯/还书请求不变。审阅进入与返回、条件分支与文件是否已生成，不增加案例和电脑常识。
