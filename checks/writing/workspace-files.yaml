  reader_goal: 读者知道主要区域各做什么，能发一条请求、看到回复并继续修改；能找到设置与后续功能入口。
  reader_start:
  - 第2章将同批完成安装说明；无项目、路径或编程知识。
  explain_now:
  - 项目组织相关工作，任务保留一次交流
  - 输入、运行、回复和真实成果的区别
  - 模型/权限/位置互相独立；/和@各自用途
  official_readings:
  - fact_id: desktop-chat-organization
    url: https://learn.chatgpt.com/docs/projects
    locator: 本轮或已登记近7日阅读中与本章有关的主体段落；具体范围见事实来源和参考来源与致谢
    checked_on: '2026-09-28'
    understanding: 桌面项目组织相关聊天，本地项目连接电脑文件夹；各项独立成果可用不同聊天组织，同一成果可继续反馈。侧栏可回到已有聊天，项目并不等于文件访问的保护边界。
    teaching_use: 只讲本章当前动作所需部分；保持文档与GUI实测、教学建议与产品保证的区分。
  - fact_id: desktop-file-shortcuts
    url: https://learn.chatgpt.com/docs/reference/commands
    locator: 本轮或已登记近7日阅读中与本章有关的主体段落；具体范围见事实来源和参考来源与致谢
    checked_on: '2026-09-28'
    understanding: 桌面Codex/Work的Open folder默认Windows Ctrl+O、Mac ⌘O；New chat为Ctrl+N/⌘N；设置为Ctrl+,/⌘,。Keyboard Shortcuts可按命令名查找并自定义绑定。
    teaching_use: 只讲本章当前动作所需部分；保持文档与GUI实测、教学建议与产品保证的区分。
  - fact_id: desktop-model-control
    url: https://learn.chatgpt.com/docs/models
    locator: 本轮或已登记近7日阅读中与本章有关的主体段落；具体范围见事实来源和参考来源与致谢
    checked_on: '2026-09-28'
    understanding: 桌面Codex可在输入框下方的模型/推理控件选择可用模型；账号可用列表与组织权限相关，模型选择不授予额外权限。 更高推理投入可能改善复杂任务，但耗时和token消耗更多；不指定所有账号统一的默认型号。
    teaching_use: 只讲本章当前动作所需部分；保持文档与GUI实测、教学建议与产品保证的区分。
  - fact_id: desktop-slash-entries
    url: https://learn.chatgpt.com/docs/reference/slash-commands
    locator: 本轮或已登记近7日阅读中与本章有关的主体段落；具体范围见事实来源和参考来源与致谢
    checked_on: '2026-09-28'
    understanding: 桌面输入区的斜线菜单提供可用命令；/model选模型、/reasoning选推理投入、/plan切换计划模式、/goal设置持续目标、/side打开临时侧聊、/status显示聊天与用量信息。具体可见命令受环境和访问条件影响。
    teaching_use: 只讲本章当前动作所需部分；保持文档与GUI实测、教学建议与产品保证的区分。
  - fact_id: permission-boundary
    url: https://learn.chatgpt.com/docs/permission-modes
    locator: 本轮或已登记近7日阅读中与本章有关的主体段落；具体范围见事实来源和参考来源与致谢
    checked_on: '2026-09-28'
    understanding: Ask for approval允许在当前工作区范围内读写文件及运行常规本地命令，需要联网或超出工作区边界时请求批准；桌面应用的权限控件位于输入框下方，CLI使用/permissions。配置及组织要求影响可用模式，自动审核不自动扩大访问边界。
    teaching_use: 只讲本章当前动作所需部分；保持文档与GUI实测、教学建议与产品保证的区分。
  - fact_id: artifact-preview
    url: https://learn.chatgpt.com/docs/artifacts-viewer
    locator: 本轮或已登记近7日阅读中与本章有关的主体段落；具体范围见事实来源和参考来源与致谢
    checked_on: '2026-09-28'
    understanding: 桌面支持文档、表格、演示文稿和PDF等成果的可视预览，并可在支持批注的预览上标注；CLI可生成和修改文件，但不提供同样的预览与批注界面。
    teaching_use: 只讲本章当前动作所需部分；保持文档与GUI实测、教学建议与产品保证的区分。
  - fact_id: desktop-followup-behavior
    url: https://learn.chatgpt.com/docs/prompting
    locator: Settings General / Follow-up behavior
    checked_on: '2026-09-28'
    understanding: 桌面General的Follow-up behavior可将运行时补充消息用于引导当前运行（Steer），或排队等待下一轮（Queue）；排队消息在输入区上方可编辑、调整顺序、发送或删除。不能承诺每次补充都会立即打断当前运行；实际快捷键由当前设置显示，不能照搬CLI键位。
    teaching_use: 只讲本章当前动作所需部分；保持文档与GUI实测、教学建议与产品保证的区分。
  - fact_id: desktop-basic-navigation
    url: https://learn.chatgpt.com/docs/reference/commands
    locator: Keyboard shortcuts / Use a slash command / input hint
    checked_on: '2026-09-28'
    understanding: 桌面可从New chat开始聊天；默认Windows Ctrl+N、Mac ⌘N新建，Ctrl+B/⌘B收放侧栏。输入区键入/打开当前可用命令列表，Codex用$显式调用技能；本地Codex的@入口可添加文件。设置可按命令名查看或修改快捷键，不能把默认键位当作所有安装的当前设置。
    teaching_use: 只讲本章当前动作所需部分；保持文档与GUI实测、教学建议与产品保证的区分。
  teaching_sequence:
  - 先看界面区域与当前任务
  - 发不带附件的短请求并修改一次
  - 认识输入区功能与控制，不展开全部档位
  - 讲找回、收放和卡住处
  defer:
  - 文件夹连接与路径到第4章
  - 消息队列/侧聊到第8章，模型和批准详细判断后置
  case_plan: 自编三条简短日常事项，只要求列清单并增加完成标记，不需要文件、网络、插件或Git。
