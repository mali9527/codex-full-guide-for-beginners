study_brief:
  mode: revision
  prepared_on: '2026-10-04'
  base_manuscript_sha256: fd58e50f590d73bbddc1e2f32b91938ce2a4258a0264d5521544c17f95f81099
  reader_goal: 能打开本书材料所在文件夹并核对路径，在该项目里新建任务、选Local和Ask for approval，发出一条短消息并看懂本轮状态，再追加一条修改。
  reader_start:
  - 已安装、登录并进入Codex；已认出New chat入口。
  - 会下载、解压、找文件夹。
  explain_now:
  - 项目与电脑文件夹的关系、路径是什么
  - 一轮请求的几种状态
  - 输入框附近各个选项各管一件什么事
  official_readings:
  - fact_id: desktop-followup-behavior
    url: https://learn.chatgpt.com/docs/prompting
    locator: Steering and queuing
    checked_on: '2026-10-04'
    understanding: 短消息先等完成；涉及方向错误时，在文件读写前就给Steer入口和等待确认，不能将停止知识完全推到第8章。
    teaching_use: 短消息先等完成；涉及方向错误时，在文件读写前就给Steer入口和等待确认，不能将停止知识完全推到第8章。
  teaching_sequence:
  - 认三个区域→侧栏与New chat
  - 取得随书材料并选外层文件夹→Open folder→Edit project核对路径→在该项目New chat→选Local→选Ask for approval并核对
  - 发三条提醒的短消息→看状态表判断本轮处于哪一步→核对结果→同一任务追加调整顺序的要求
  - 完成小任务后再认输入框附近的设置、其他入口和成果面板，各用两三句并指向主讲章
  - 短消息先等完成；涉及方向错误时，在文件读写前就给Steer入口和等待确认，不能将停止知识完全推到第8章。
  defer:
  - 模型与Effort选择留第6章，权限模式留第7章
  - 附件与文件引用的选择留第9章，预览与批注留第10章
  - Steer、Queue和停止留第8章
  - 本版不要求双平台实测；未测记录独立保留。未获证实的控件位置不补猜。
  case_plan: 三条自设提醒（水杯两次、还书一次），只回复文字；「我的待办」已连接但本章不读写其中文件。修订把重复于后章的设置讲解压成指路，让第一条消息更早出现在读者眼前。
