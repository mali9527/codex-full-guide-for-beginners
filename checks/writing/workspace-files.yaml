study_review:
  result: pass
  reason: 官方区分项目组织、Local运行位置与权限，正文在实际选择材料时分别解释，并把路径提前到首次核对地址处。删除常识教学，保留可操作的乱码和选错目录排障。
reader_review:
  prior_knowledge:
    result: pass
    reason: 第1/2章已新写，应用、模型、登录前置可回读；解压/打开只给动作，路径在首次使用时简释。
  concept_timing:
    result: pass
    reason: 外层目录选择先说明读材料和写结果的需要；项目、聊天与Local各自解决的问题接在动作后。
  information_value:
    result: pass
    reason: 权限的请求时机和项目非绝对边界保留；删去编码科普、文件扩展名定义与无关系统菜单。
  natural_style:
    result: pass
    reason: 用两份备忘贯穿准备、只读核对及进入下一章；排障表对应实际卡点，不把正常步骤拆成冗长清单。
  localization:
    result: pass
    reason: Windows/Mac路径都是明确示例用户名；默认快捷键分平台；中文引号一致，英文按钮与解释区分。
  independent_creation:
    result: pass
    reason: 首次任务的通用先读材料思路来自比较而非逐段重写；本书选定外层文件夹理由、备忘内容和排障表独立编写。
