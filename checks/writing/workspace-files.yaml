  base_manuscript_sha256: fac59bbebd5241bde4700fa0f59c26114a20caf897b9917988d272f616feadcc
  reader_goal: 把项目文件夹作为第一次使用的明确基础动作：知道为何需要、怎么打开/设置、选哪层并核对当前任务位置。
  reader_start:
  - 已安装进入Codex，会常见文件夹操作；原第3章只认项目名称而未教连接，作者指出顺序缺口。
  explain_now:
  - 本地文件夹和项目名称不同
  - Open folder与Edit project/Add folder
  - 路径核对及主要文件夹
  - 为该项目新建任务并确认Local
  official_readings:
  - fact_id: local-project-context
    url: https://learn.chatgpt.com/docs/projects
    locator: Use local projects for folders and codebases；Choose a project
    checked_on: '2026-09-29'
    understanding: 仅创建或重命名项目不等于连接本地目录；Edit project/Add folder/Make primary各有作用。
    teaching_use: 把打开文件夹作为独立基础步骤；高级多目录只作必要条件说明。
  - fact_id: desktop-file-shortcuts
    url: https://learn.chatgpt.com/docs/reference/commands
    locator: Windows/macOS General：Open folder、command menu；New chat
    checked_on: '2026-09-29'
    understanding: 两平台打开文件夹和找命令的默认入口明确，当前绑定可能变化。
    teaching_use: 同时给动作名和双平台快捷键，不猜按钮图标。
  - fact_id: local-run-mode
    url: https://learn.chatgpt.com/docs/environments/modes
    locator: Local
    checked_on: '2026-09-29'
    understanding: Local直接围绕当前项目目录，不是离线承诺。
    teaching_use: 放在新建项目任务时核对，而不只在设置表里定义。
  teaching_sequence:
  - 侧栏认识后立即准备并打开文件夹
  - 核对地址和新任务位置，再发短消息
  - 已有材料入口和设置解释回指实际项目
  defer:
  - 多目录高级管理、Git、worktree和项目配置文件
  - 没有真实截图不画界面
  case_plan: 沿用本书我的待办ZIP和两备忘；准备/连接/路径前移第3章，第4章从正确项目读材料。无新业务例、无运行效果保证。
