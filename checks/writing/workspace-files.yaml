study_brief:
  mode: revision
  prepared_on: '2026-09-29'
  base_manuscript_sha256: e45fc08cf8c9c607c7f3d3313d03878b74cf6d61e11d6e4386df75ff4a1fd599
  reader_goal: 能打开本书材料所在文件夹并核对路径，在该项目里新建任务、选Local和Ask for approval，发出一条短消息并看懂本轮状态，再追加一条修改。
  reader_start:
  - 已安装、登录并进入Codex；已认出New chat入口。
  - 会下载、解压、找文件夹。
  explain_now:
  - 项目与电脑文件夹的关系、路径是什么
  - 一轮请求的几种状态
  - 输入框附近各个选项各管一件什么事
  official_readings:
  - fact_id: local-project-context
    url: https://learn.chatgpt.com/docs/projects
    locator: Local projects；Edit project、Add folder、Make primary
    checked_on: '2026-09-29'
    understanding: 需要读写电脑文件时添加本地项目；Edit project可增改文件夹，新任务从主要文件夹开始，次要文件夹可搜索读写但不自动发现项目文件。
    teaching_use: 先用Open folder完成连接并核对路径，已有项目的Add folder与Make primary缩成一段备选入口。
  - fact_id: desktop-file-shortcuts
    url: https://learn.chatgpt.com/docs/reference/commands
    locator: General与Chats快捷键表
    checked_on: '2026-09-29'
    understanding: Open folder为Ctrl+O与⌘O且限Codex和Work；New chat为Ctrl+N与⌘N；批准与拒绝键只在请求打开时适用；页面没有停止运行的快捷键。
    teaching_use: 只给打开文件夹、新任务、侧栏、命令菜单四组键位；不写停止键。
  - fact_id: permission-boundary
    url: https://learn.chatgpt.com/docs/permission-modes
    locator: Ask for approval；控件位置
    checked_on: '2026-09-29'
    understanding: 该模式可在当前工作区读写并运行常规本地命令，联网或越出边界前询问；控件在输入框下方；官方建议多数工作从它开始。
    teaching_use: 发送前选定并核对，详解留第7章。
  - fact_id: desktop-followup-behavior
    url: https://learn.chatgpt.com/docs/prompting
    locator: Steering and queuing
    checked_on: '2026-09-29'
    understanding: 运行中的消息可引导当前运行或排队等下一轮，由设置决定。
    teaching_use: 本章只要求等一轮结束再反馈，一句话指向第8章。
  teaching_sequence:
  - 认三个区域→侧栏与New chat
  - 取得随书材料并选外层文件夹→Open folder→Edit project核对路径→在该项目New chat→选Local→选Ask for approval并核对
  - 发三条提醒的短消息→看状态表判断本轮处于哪一步→核对结果→同一任务追加调整顺序的要求
  - 完成小任务后再认输入框附近的设置、其他入口和成果面板，各用两三句并指向主讲章
  defer:
  - 模型与Effort选择留第6章，权限模式留第7章
  - 附件与文件引用的选择留第9章，预览与批注留第10章
  - Steer、Queue和停止留第8章
  case_plan: 三条自设提醒（水杯两次、还书一次），只回复文字；「我的待办」已连接但本章不读写其中文件。修订把重复于后章的设置讲解压成指路，让第一条消息更早出现在读者眼前。
