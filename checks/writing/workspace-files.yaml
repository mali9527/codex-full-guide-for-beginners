study_brief:
  mode: retrospective
  prepared_on: '2026-09-26'
  base_manuscript_sha256: 8d41fbf3e9bb15133bedea035acff250f9239391e001ed96f8a9be567676ce1a
  reader_goal: 连接自有材料所在的文件夹，理解聊天、运行位置和权限怎样影响当前读取；用文件名与内容判断是否找对材料。
  reader_start:
  - 会下载、解压、使用文件夹和常见快捷键；没有编程与Codex经验。
  - 当前稿承接第2章安装与登录，但第2章仍为占位，这一前置未完成，不能宣称连续路径可交付。
  explain_now:
  - 本地项目、聊天和Local分别组织什么，它们怎样指向同一份材料。
  - 权限约束与「先不要改文件」这句工作要求的区别。
  - 提示词的用途，以及为什么要核对读取的内容和真实原件。
  teaching_sequence:
  - 先认识自有两份备忘和整理目标，确定连接外层文件夹的理由。
  - 按材料放在哪里、在哪里交流、在哪里处理结果说明项目与聊天及Local的关系。
  - 理解权限后发出只读请求，核对文件名和关键内容，再检查实际原件；不以回复代替结果。
  defer:
  - 工作树、云环境和多入口高级配置；此时不为解释Local而展开这些概念。
  - Git、终端和编码原理；乱码分支需要可执行并实测的处理，不靠定义补足。
  case_plan: 沿用本书自行编写的两份日常备忘，先读不整理；用照片数量和笔记本规格核对材料。后续修订删去没有实际故障的打开软件支线，补足第2章和经验证的乱码处理；本次不改正文。
  official_readings:
  - fact_id: local-run-mode
    url: https://learn.chatgpt.com/docs/environments/modes
    locator: Local / Worktree / Cloud 的桌面运行位置说明
    checked_on: '2026-09-26'
    understanding: Local指向电脑上的当前项目目录；这是桌面选择器的含义，不能据此推断CLI不能在本地工作。
    teaching_use: 先讲材料位置，再解释本例选Local所对应的处理位置，其他运行方式后置。
  - fact_id: permission-boundary
    url: https://learn.chatgpt.com/docs/permission-modes
    locator: Permission modes / Ask for approval / How permissions work
    checked_on: '2026-09-26'
    understanding: 模式、工作范围和组织配置共同决定可做的事；请求批准不表示每个文件动作都再询问，文本请求也不会切换权限。
    teaching_use: 把权限与提示词分开解释，提示检查真实文件；不将项目目录说成所有配置下的绝对访问边界。
  - fact_id: desktop-file-shortcuts
    url: https://learn.chatgpt.com/docs/reference/commands
    locator: macOS / Windows：General、Chats 与自定义快捷键说明
    checked_on: '2026-09-26'
    understanding: 默认打开文件夹快捷键在Codex/Work入口适用，可被自定义；默认新聊天快捷键不能证明当前窗口状态。
    teaching_use: 直接给快捷键和目标文件夹，不解释按键手势；界面名称与完整路径另实测。
