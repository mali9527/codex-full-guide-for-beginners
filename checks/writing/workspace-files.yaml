study_brief:
  mode: revision
  prepared_on: '2026-09-28'
  base_manuscript_sha256: 3f97b4010bea9560ae912970225be697f796489c10e35ac88019668461323462
  reader_goal: 把第2章认识的项目与聊天用起来，连接两份备忘并读到正确内容。
  reader_start:
  - 已读价值、安装和界面用途；知道项目和聊天大致作用但未实际选文件夹。
  explain_now:
  - 选择共同外层文件夹的原因、路径、Local与权限对实际材料的影响。
  official_readings:
  - fact_id: local-project-context
    url: https://learn.chatgpt.com/docs/projects
    locator: Use local projects for folders and codebases
    checked_on: '2026-09-28'
    understanding: 项目把目录与相关聊天连在一起，新聊天从主要目录开始；项目不等于权限。
    teaching_use: 解释每一步为何发生，而不连续下定义。
  - fact_id: local-run-mode
    url: https://learn.chatgpt.com/docs/environments/modes
    locator: Codex environments / Local
    checked_on: '2026-09-27'
    understanding: Local直接在当前项目目录工作；选择器不是一个文件夹名称。
    teaching_use: 先说明处理位置再给Local词，避免误解为电脑不联网。
  - fact_id: permission-boundary
    url: https://learn.chatgpt.com/docs/permission-modes
    locator: Ask for approval / Enable modes / How permissions work
    checked_on: '2026-09-28'
    understanding: 该档工作区内可读写，额外访问询问，文字请求不改变模式。
    teaching_use: 要求核对原件而非保证不会改；设置/组织限制保留。
  - fact_id: desktop-file-shortcuts
    url: https://learn.chatgpt.com/docs/reference/commands
    locator: macOS/Windows General、Chats
    checked_on: '2026-09-28'
    understanding: 两平台默认Open folder、新聊天、设置快捷键各自列明。
    teaching_use: 给准确按键和对象，不拆手势。
  - fact_id: desktop-file-shortcuts
    url: https://learn.chatgpt.com/docs/reference/settings
    locator: Keyboard shortcuts
    checked_on: '2026-09-27'
    understanding: 能按命令名查现行绑定。
    teaching_use: 快捷键失效有具体去处，不只说检查是否改过。
  - fact_id: desktop-chat-organization
    url: https://learn.chatgpt.com/docs/projects
    locator: 本地项目/聊天组织
    checked_on: '2026-09-28'
    understanding: 桌面项目组织相关聊天，本地项目连接电脑文件夹；各项独立成果可用不同聊天组织，同一成果可继续反馈。侧栏可回到已有聊天，项目并不等于文件访问的保护边界。
    teaching_use: 回复和真实文件分别核对；同一任务留在同一聊天，自然接下一章。
  teaching_sequence:
  - 沿案例完成打开文件夹、新聊天、读文件；项目不再重新作抽象定义。
  - 回复和真实文件分别核对；同一任务留在同一聊天，自然接下一章。
  defer:
  - 不引入版本管理、全盘搜索或文档复杂格式。
  case_plan: 保留两份原始备忘，缩短重复概念解释，新增操作与界面的对应。
