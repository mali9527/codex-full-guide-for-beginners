reviewed_on: '2026-10-04'
reviewer: codex
study_brief:
  mode: revision
  prepared_on: '2026-10-04'
  base_manuscript_sha256: 7aa13c88422d48d16c9e8f628727a07b8acbe8897754dd9b00926deed68ee23f
  reader_goal: 能判断是否需要操作应用，完成安装启用与系统授权，从一个只读小动作开始并核对真实结果，知道怎样撤回授权。
  reader_start:
  - 已会用文件、截图、应用快照和浏览器；已懂权限三层。
  explain_now:
  - 系统授权、应用批准与任务权限是三层
  - Windows前台与Mac权限的差别
  - 结束任务与撤回授权
  official_readings:
  - fact_id: desktop-computer-use
    url: https://learn.chatgpt.com/docs/computer-use
    locator: Safety guidance / App permissions
    checked_on: '2026-10-04'
    understanding: 应用访问请求可以Cancel；只读案例先确认应用，再允许单次读取；未知立即停止控件不作为已教会的前提。
    teaching_use: 应用访问请求可以Cancel；只读案例先确认应用，再允许单次读取；未知立即停止控件不作为已教会的前提。
  teaching_sequence:
  - 先判断是否需要→安装启用→系统授权分平台
  - 应用批准→开始前准备窗口并确认停止方式
  - 小范围只读请求→核对真实应用里的结果→结束与撤回
  - 应用访问请求可以Cancel；只读案例先确认应用，再允许单次读取；未知立即停止控件不作为已教会的前提。
  defer:
  - 普通任务的直接停止控件缺依据，仍按Steer停止要求并提示先退回文件或快照路线
  - 本版不要求双平台实测；未测记录独立保留。未获证实的控件位置不补猜。
  case_plan: 查看已打开的自编清单窗口中一项是否完整显示；只读。
