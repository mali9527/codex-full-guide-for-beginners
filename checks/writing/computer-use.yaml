  reader_goal: 能判断是否需要操作应用，完成安装启用与系统授权，从一个只读小动作开始并核对真实结果，知道怎样撤回授权。
  reader_start:
  - 已会用文件、截图、应用快照和浏览器；已懂权限三层。
  explain_now:
  - 系统授权、应用批准与任务权限是三层
  - Windows前台与Mac权限的差别
  - 结束任务与撤回授权
  official_readings:
  - fact_id: desktop-computer-use
    url: https://learn.chatgpt.com/docs/computer-use
    locator: 平台、权限、应用批准与限制
    checked_on: '2026-09-28'
    understanding: 支持macOS与Windows，Windows仅前台；macOS需屏幕录制与辅助功能授权；按应用请求许可，可选Always allow并在设置中移除；不能操作终端类应用和ChatGPT自身，也不能批准系统安全提示。
    teaching_use: 从只读查看一个窗口开始，分平台写条件。
  teaching_sequence:
  - 先判断是否需要→安装启用→系统授权分平台
  - 应用批准→开始前准备窗口并确认停止方式
  - 小范围只读请求→核对真实应用里的结果→结束与撤回
  defer:
  - 普通任务的直接停止控件缺依据，仍按Steer停止要求并提示先退回文件或快照路线
  case_plan: 查看已打开的自编清单窗口中一项是否完整显示；只读。
