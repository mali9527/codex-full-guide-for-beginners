  reader_goal: 分清文件、快照与真实应用操作，并从小范围验证授权。
  reader_start:
  - 已学插件、浏览器、权限；普通任务直接停止控件缺证。
  explain_now:
  - Mac系统与应用两层授权
  - Windows前台使用条件
  - 实际结果与退出/撤销不同
  official_readings:
  - fact_id: desktop-computer-use
    url: https://learn.chatgpt.com/docs/computer-use
    locator: Setup; Windows; Permissions; Safety
    checked_on: '2026-09-29'
    understanding: 两平台流程不同，Windows占用前台，不能自动批准系统安全请求。
    teaching_use: 先安装启用、确认目标和停控，再只读自编清单，检查窗口与文本。
  - fact_id: appshot-input-scope
    url: https://learn.chatgpt.com/docs/appshots
    locator: Capture
    checked_on: '2026-09-29'
    understanding: 只给材料时快照足够，不等于接管。
    teaching_use: 用同一清单比较三种路线，控制是按需选项。
  teaching_sequence:
  - 先判断是否需要UI→确认适用平台/账号→插件启用→系统授权→应用批准→确认停止控制/正确窗口→只读小动作→检查→按需撤销
