    locator: Overview
    checked_on: '2026-09-29'
    understanding: Micro是硬件，不是轻量模型。
    teaching_use: 用一句识别避免读者误会必须买。
  teaching_sequence:
  - 从用户问题找到主讲章→查已用命令或设置→确认平台和当前可用→回正文按完整前置操作
