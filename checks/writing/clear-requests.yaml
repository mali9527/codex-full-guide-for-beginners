  reader_goal: 能把一句含糊要求补成说明用途、材料角色、必须与偏好、缺信息处理方式的请求。
  reader_start:
  - 已会完整做一次任务并检查成果。
  explain_now:
  - 用途决定方向
  - 材料的角色
  - 必须保持与可以调整
  - 缺信息时问还是留
  official_readings:
  - fact_id: task-materials-and-output
    url: https://learn.chatgpt.com/docs/prompting
    locator: Prompting overview至Put the pieces together
    checked_on: '2026-09-29'
    understanding: 按需说明目标、背景、输出与边界，避免僵硬公式；只加一两条真正防止问题的边界；结果用跟进消息改进。
    teaching_use: 全章从一句「弄得好看一点」逐步补全，结尾合成一段请求并说明不是模板。
  teaching_sequence:
  - 先说结果拿来做什么→材料各是什么角色
  - 必须与偏好分开→缺信息怎样处理
  - 不规定内部步骤→合成完整请求
  defer:
  - Plan入口留第15章
  - 反馈判断留第16章
  case_plan: 沿用待办清单v2，目标为每日查看版；自设。
