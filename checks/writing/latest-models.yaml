  reader_goal: 读完能说出Astra、Sol、Luna各自先考虑什么工作，知道Effort指思考投入、Astra从Light起步，并知道从哪一章开始读。
  reader_start:
  - 只有日常电脑与办公经验，尚未安装应用，也没有发过任何请求。
  explain_now:
  - 推理在整理材料这类小事里指什么
  - 模型、Codex入口和工具各管什么
  - Effort是思考投入，不是回答长短
  official_readings:
  - fact_id: gpt6-model-use-position
    url: https://learn.chatgpt.com/docs/models
    locator: Recommended models / GPT-6.1 Sol / Pick a reasoning effort
    checked_on: '2026-10-04'
    understanding: 模型建议随型号变化；示例控件默认不代表每个账号。Astra开篇保留，补6.1 Sol可用条件。
    teaching_use: 表格只作任务起点；操作从当前可用设置开始，不把旧Sol Medium强加给新版。
  teaching_sequence:
  - 从整理几份资料的实际麻烦进入→说明Astra的定位→四种能帮上忙的情形各用一个自设小例
  - 分清模型、Codex与工具→怎样提要求→何时选Astra与Effort起点
  - 已安装者：输入框下方模型控件→Advanced→核对型号与档位；未安装者指向第1、2章
  - 沿用原讲解顺序；Power示例与实际默认分开，6.1 Sol从可用默认开始，Fast按用量来源区分。
  defer:
  - Power各预设、Max、Ultra、Fast与用量关系留第6章
  - 权限与批准留第7章，运行中补充留第8章
  case_plan: 沿用本书自编备忘中的发照片一例，以及自设的两台设备资料比较情景；示例只说明用法，不写成模型测试结果。本轮修订压缩重复的限制句，把判断放在段首。
