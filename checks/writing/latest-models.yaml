  reader_goal: 让没有编程经验的读者具体理解GPT-6 Astra的用途、工作方式、输入与工具、选择及配合方法，能判断为什么使用它。
  reader_start:
  - 全书开篇，没有安装或前章前置；有电脑与办公经验。
  explain_now:
  - 多步骤完成与一次文字回答的区别
  - 模型、图像输入和工具的分工
  - 针对重要缺口提问、接住反馈及完成标准
  - Astra与Sol/Luna和Effort起点
  official_readings:
  - fact_id: astra-collaboration-behavior
    url: https://developers.openai.com/api/docs/guides/latest-model?model=gpt-6-astra
    locator: Introduction；GPT-6 Astra behavior；Initiative and follow-through；Personality
      and writing style
    checked_on: '2026-09-29'
    understanding: 能力不只是回答难题，也包括连续处理、针对关键缺口提问、接住修改与行为倾向。
    teaching_use: 用资料比较到说明稿的自编情景解释，不用开发领域术语或性能保证。
  - fact_id: astra-model-input-tools
    url: https://developers.openai.com/api/docs/models/gpt-6-astra
    locator: Model description；Modalities；Tools
    checked_on: '2026-09-29'
    understanding: 看图是模型输入能力，操作应用和生成图片要有工具；API数字不等于桌面用户得到的上限。
    teaching_use: 给截图解释/实际改页面的对比，说明材料与工具关系，后置具体工具操作。
  - fact_id: astra-outcome-guidance
    url: https://learn.chatgpt.com/docs/prompting
    locator: Describe the result；Add useful context；Set boundaries；Make result ready
      to use
    checked_on: '2026-09-29'
    understanding: 目标、材料、成果、边界比机械步骤更重要；并非固定提示词模板。
    teaching_use: 加入自编说明稿请求，解释哪些要求值得写。
  - fact_id: astra-outcome-guidance
    url: https://developers.openai.com/blog/rethinking-skills-and-prompts-for-gpt-6-astra
    locator: Better skills；Up-to-date AGENTS.md；Persistence
    checked_on: '2026-09-29'
    understanding: 旧指令过密或边界含混可能让Astra反复准备或过早停下。
    teaching_use: 给完成标准和保留关键批准的对比，不教删权限或全面放行。
  - fact_id: astra-outcome-guidance
    url: https://learn.chatgpt.com/docs/model-selection
    locator: Experiment；How to think about models and reasoning effort
    checked_on: '2026-09-29'
    understanding: 按同输入比较是否够好，以较轻设置开始；官方推荐不等于保证。
    teaching_use: 选择建议服务日常判断，具体模型控制仍留第6章。
  - fact_id: reasoning-default-guidance
    url: https://learn.chatgpt.com/docs/models
    locator: Models / Use ChatGPT / Permissions中本轮实际读取的相关主体段落
    checked_on: '2026-09-29'
    understanding: Astra Light、Medium及高投入按工作难度选择；Max/Ultra不是普通任务必需。
    teaching_use: 最小解释思考投入与等待，避免把Light等同短答。
  - fact_id: desktop-model-control
    url: https://learn.chatgpt.com/docs/models
    locator: Models / Use ChatGPT / Permissions中本轮实际读取的相关主体段落
    checked_on: '2026-09-29'
    understanding: 输入框下方Power与Advanced可选，实际可见性受环境影响。
    teaching_use: 保留最短入口，尚未安装读者可先看用途。
  - fact_id: gpt6-model-use-position
    url: https://learn.chatgpt.com/docs/models
    locator: Models / Use ChatGPT / Permissions中本轮实际读取的相关主体段落
    checked_on: '2026-09-29'
    understanding: Astra偏持续多步骤判断；Sol/Luna依任务范围也适用。
    teaching_use: Astra详细介绍后再比较，不用表格代替Astra正文。
  - fact_id: codex-work-scenarios
    url: https://learn.chatgpt.com/docs/use-chatgpt
    locator: Models / Use ChatGPT / Permissions中本轮实际读取的相关主体段落
    checked_on: '2026-09-29'
    understanding: Codex也可研究文档等，工具与账号有条件。
    teaching_use: 非编程用户的例子仍留在桌面Codex。
  - fact_id: permission-boundary
    url: https://learn.chatgpt.com/docs/permission-modes
    locator: Models / Use ChatGPT / Permissions中本轮实际读取的相关主体段落
    checked_on: '2026-09-29'
    understanding: 提示词决定本次要求，权限决定可操作范围；模型更新不扩大边界。
    teaching_use: 人要核对材料和实际成果，不能以更强模型取消检查。
  teaching_sequence:
  - 从普通资料任务引出Astra价值
  - 以多个具体能力和自编例子讲清阅读判断、工具和持续修改
  - 解释怎样交代要求、少量有用设置与检查
  - 给安装和后续章节入口
  defer:
  - API参数、价格、上下文数字、迁移代码和性能跑分
  - Max/Ultra、技能安装和浏览器/电脑操作细节
  - 实验上下文管理默认关闭及配置，不设新手前置
  case_plan: 沿用本书两份备忘作轻量预告；新增两份设备说明与个人需求对比的假设情景，不填真实品牌价格；自编整理说明稿请求，仅展示提法，不冒充实际Astra运行。
