    result: pass
    reason: 设备/家人/提醒案例不绑定地区语种；中文引号统一，Power/Advanced/Light保留真实名称；没有以某国账号或本机界面代表全部用户。
  independent_creation:
    result: pass
    reason: 对照实际官方文章与既有来源记录：正文以自编设备材料、说明稿、截图/原文件情景组织，不复刻博客技能数据库示例、代码、结构或原教程独特案例。两条备忘来自本书已有原创材料；未虚称本轮新读第三方教程。
