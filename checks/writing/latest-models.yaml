  reader_goal: 读完能说出Astra、Sol、Luna各自先考虑什么工作，知道Effort指思考投入、Astra从Light起步，并知道从哪一章开始读。
  reader_start:
  - 只有日常电脑与办公经验，尚未安装应用，也没有发过任何请求。
  explain_now:
  - 推理在整理材料这类小事里指什么
  - 模型、Codex入口和工具各管什么
  - Effort是思考投入，不是回答长短
  official_readings:
  - fact_id: reasoning-default-guidance
    url: https://learn.chatgpt.com/docs/models
    locator: Choose a model；Power presets与Advanced；起步建议
    checked_on: '2026-09-29'
    understanding: 页面给出六个Power预设和Advanced分选；起步建议为Astra Light、Sol Medium、Luna High；Luna不支持Ultra；可用性取决于开放进度、登录方式和客户端。
    teaching_use: 开篇只讲Astra从Light起步和选择入口，预设清单与Max、Ultra留第6章，不在导读堆档位。
  - fact_id: gpt6-model-use-position
    url: https://learn.chatgpt.com/docs/model-selection
    locator: 各模型适用工作与比较建议
    checked_on: '2026-09-29'
    understanding: Luna适合范围明确的小改动和提取，Sol适合日常研究与需要判断的工作，Astra适合需要广泛上下文和完整成果的工作；建议用相同输入比较并保留满足质量要求的最轻设置。
    teaching_use: 用一张三行表给起点，随后用「相同材料比较结果」代替型号排名。
  - fact_id: astra-outcome-guidance
    url: https://learn.chatgpt.com/docs/prompting
    locator: Describe the result；Set boundaries；Make the result ready to use
    checked_on: '2026-09-29'
    understanding: 官方建议先说成果、相关背景和少量关键边界，不用固定模板；后续用跟进消息修改。
    teaching_use: 请求示例只保留读者、依据、何时询问和完成标准四件事，并说明不是要背的句式。
  teaching_sequence:
  - 从整理几份资料的实际麻烦进入→说明Astra的定位→四种能帮上忙的情形各用一个自设小例
  - 分清模型、Codex与工具→怎样提要求→何时选Astra与Effort起点
  - 已安装者：输入框下方模型控件→Advanced→核对型号与档位；未安装者指向第1、2章
  defer:
  - Power各预设、Max、Ultra、Fast与用量关系留第6章
  - 权限与批准留第7章，运行中补充留第8章
  case_plan: 沿用本书自编备忘中的发照片一例，以及自设的两台设备资料比较情景；示例只说明用法，不写成模型测试结果。本轮修订压缩重复的限制句，把判断放在段首。
