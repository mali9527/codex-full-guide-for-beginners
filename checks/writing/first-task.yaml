    url: https://learn.chatgpt.com/docs/models
    locator: Power / Pick a reasoning effort
    checked_on: '2026-09-28'
    understanding: 官方Models建议从账号可用的默认Power设置起步；Advanced中可分选模型、Effort和速度。Pick a reasoning effort给出Sol Medium、Luna High、Astra
      Light的起步建议；这是建议，不是所有账号实际选中值。页面示意的起始预设与实际默认还受套餐、客户端、工作区和开放进度影响。
