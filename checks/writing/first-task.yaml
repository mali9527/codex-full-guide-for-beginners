  reader_goal: 在已连接的项目里让Codex读取两份备忘、生成并保存v1，到文件夹打开核对四项事实，再按新进展另存v2。
  reader_start:
  - 第3章已打开「我的待办」并会新建任务、选Local与权限、读一轮状态。
  explain_now:
  - 聊天里的完成说明、预览和实际文件是三样东西
  - 完成标准先于请求
  - 任务要求与权限设置的区别
  official_readings:
  - fact_id: desktop-followup-behavior
    url: https://learn.chatgpt.com/docs/prompting
    locator: Steering and queuing
    checked_on: '2026-10-04'
    understanding: 读取与生成分开；首次写文件前回指第3章已讲的纠正入口。避免靠同名文件夹或顺手联网完成其他事项。
    teaching_use: 读取与生成分开；首次写文件前回指第3章已讲的纠正入口。避免靠同名文件夹或顺手联网完成其他事项。
  teaching_sequence:
  - 回到项目→New chat→到文件夹读两份原件→回任务核对模型与权限
  - 只读确认读到的内容→定完成标准→发整理并保存的请求→看进展与可能的提问
  - 到文件夹打开v1→按四项事实核对→有错才纠正→确认v1后发v2请求→打开两版比较
  - 读取与生成分开；首次写文件前回指第3章已讲的纠正入口。避免靠同名文件夹或顺手联网完成其他事项。
  defer:
  - 模型选择原理留第6章
  - 批注操作留第10章
  - 任务找回与上下文留第12、13章
  - 本版不要求双平台实测；未测记录独立保留。未获证实的控件位置不补猜。
  case_plan: 两份自编备忘、四件待办、v1与v2两版配套结果；笔记本已买是演示中的新消息。修订收紧设置一节的连续限制句，其余保持。
