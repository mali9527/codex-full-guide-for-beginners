study_brief:
  mode: retrospective
  prepared_on: '2026-09-26'
  base_manuscript_sha256: a50f9ce225800c546765711bfb22987e32ec78efa3e580387a16630be3b64d70
  reader_goal: 提出可检查的整理要求，找到真实成果，核对语义与未知信息，按明确范围修改并保留版本。
  reader_start:
  - 会普通电脑文件操作，不懂编程；前章已解释本地项目、聊天、权限和提示词。
  - 实际连续路径尚缺第2章与双平台GUI证据；这里仅回放现有文字和自有材料。
  explain_now:
  - 聊天里显示结果与实际保存文件不同；路径帮助定位眼前成果。
  - 完成标准要能检查含义，不能仅看数字和措辞是否流畅。
  - 工作请求限定任务，但不保证模型每次正确执行；修改后检查变化及未变部分。
  teaching_sequence:
  - 先对比两条原备忘与期望清单，说明合并、保留、未知不猜这些完成标准。
  - 给出原创请求后打开实际成果，按需要引入路径。
  - 用截止与开始、未预约与已预约的差别检查语义，再做一次有依据的局部修改与版本保留。
  defer:
  - 路径语法、盘符、终端命令；此章只需认清保存位置。
  - 自动化、多任务并行和复杂工具调用；先走通可观察的单次任务。
  case_plan: 使用自编两份备忘、四项待办和两版结果，不另加复杂数据；学习提出完成标准、分开事实与未知、小步修改。材料仅是教学演示，不能登记为实际桌面运行回执。
  official_readings:
  - fact_id: permission-boundary
    url: https://learn.chatgpt.com/docs/permission-modes
    locator: Ask for approval / How permissions work
    checked_on: '2026-09-26'
    understanding: 是否请求批准取决于操作及环境边界，不能把每次发送请求描述成必有弹窗；提示词中的边界仍须检查执行。
    teaching_use: 正文将权限请求作为条件分支，把「保留原件」写成任务要求，再以真实文件检查；不从示例请求推导产品保证。
