    reason: 材料为虚构日常事项，不绑定特定国家语种；两种系统共享相对文件位置，真实按钮不翻译造词。
  independent_creation:
    result: pass
    reason: 对照六项来源本批实读范围及此前案例决定，未复制他人的网站/名片/md2html、提示词和经历；bozhou旧案例本轮未重获原文的边界保留。
