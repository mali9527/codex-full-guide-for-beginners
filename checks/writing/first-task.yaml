  reader_goal: 在已连接的项目里让Codex读取两份备忘、生成并保存v1，到文件夹打开核对四项事实，再按新进展另存v2。
  reader_start:
  - 第3章已打开「我的待办」并会新建任务、选Local与权限、读一轮状态。
  explain_now:
  - 聊天里的完成说明、预览和实际文件是三样东西
  - 完成标准先于请求
  - 任务要求与权限设置的区别
  official_readings:
  - fact_id: permission-boundary
    url: https://learn.chatgpt.com/docs/permission-modes
    locator: Ask for approval
    checked_on: '2026-09-29'
    understanding: 允许工作区内读写，越界或联网前询问；不是每改一行都问。
    teaching_use: 首例继续使用该模式，遇到请求时看对象与目的。
  - fact_id: task-materials-and-output
    url: https://learn.chatgpt.com/docs/prompting
    locator: Describe the result；Improve the result with follow-up messages
    checked_on: '2026-09-29'
    understanding: 先说成果，后用具体跟进修改，不必重开。
    teaching_use: 请求写明文件名、位置与保存后的检查；修改用同一任务。
  - fact_id: artifact-preview
    url: https://learn.chatgpt.com/docs/artifacts-viewer
    locator: 预览格式与自动打开
    checked_on: '2026-09-29'
    understanding: 桌面预览文档、表格、演示文稿、PDF与生成的HTML；自动打开受设置影响。
    teaching_use: 文本清单走文件夹核对路线，不依赖预览。
  teaching_sequence:
  - 回到项目→New chat→到文件夹读两份原件→回任务核对模型与权限
  - 只读确认读到的内容→定完成标准→发整理并保存的请求→看进展与可能的提问
  - 到文件夹打开v1→按四项事实核对→有错才纠正→确认v1后发v2请求→打开两版比较
  defer:
  - 模型选择原理留第6章
  - 批注操作留第10章
  - 任务找回与上下文留第12、13章
  case_plan: 两份自编备忘、四件待办、v1与v2两版配套结果；笔记本已买是演示中的新消息。修订收紧设置一节的连续限制句，其余保持。
