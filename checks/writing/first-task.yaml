  reader_goal: 在同一聊天要求整理保存，读懂过程与成果区别，反馈具体问题并另存新版本。
  reader_start:
  - 已通过第3章找到两份文件；认识项目/Local/权限/聊天。
  explain_now:
  - 同一成果连续对话与新任务开新聊天的用途；预览与实际文件的关系。
  official_readings:
  - fact_id: local-run-mode
    url: https://learn.chatgpt.com/docs/environments/modes
    locator: Local
    checked_on: '2026-09-27'
    understanding: 直接写当前项目目录，需实际读回确认成果。
    teaching_use: 把找文件放在聊天回复之后，不保证每次有文件链接。
  - fact_id: local-project-context
    url: https://learn.chatgpt.com/docs/projects
    locator: Use local projects for folders and codebases
    checked_on: '2026-09-28'
    understanding: 项目可读改目录内文件；当前任务继续同一聊天无需切目录。
    teaching_use: 保持材料、结果在同一项目，明确修改文件名。
  - fact_id: permission-boundary
    url: https://learn.chatgpt.com/docs/permission-modes
    locator: Ask for approval
    checked_on: '2026-09-28'
    understanding: 生成及修改受当前允许范围影响。
    teaching_use: 出权限请求按作用对象判断，不写每次都有或自动通过。
  - fact_id: desktop-chat-organization
    url: https://learn.chatgpt.com/docs/projects
    locator: 本地项目/聊天组织
    checked_on: '2026-09-28'
    understanding: 桌面项目组织相关聊天，本地项目连接电脑文件夹；各项独立成果可用不同聊天组织，同一成果可继续反馈。侧栏可回到已有聊天，项目并不等于文件访问的保护边界。
    teaching_use: 在原聊天提出纠错和状态更新，让基本操作贯穿小案例，而不是另列功能清单。
  - fact_id: artifact-preview
    url: https://learn.chatgpt.com/docs/artifacts-viewer
    locator: Work with files开篇
    checked_on: '2026-09-28'
    understanding: 桌面支持文档、表格、演示文稿和PDF等成果的可视预览，并可在支持批注的预览上标注；CLI可生成和修改文件，但不提供同样的预览与批注界面。
    teaching_use: 在原聊天提出纠错和状态更新，让基本操作贯穿小案例，而不是另列功能清单。
  - fact_id: codex-work-scenarios
    url: https://learn.chatgpt.com/docs/use-chatgpt
    locator: Work/Codex桌面对照与自然语言反馈
    checked_on: '2026-09-28'
    understanding: Codex与Work的桌面能力有重叠，Codex可用于研究、文档、演示文稿及其他知识工作，也提供开发视图；自然语言要求可随结果继续修订。文件、联网、工具等能力取决于平台、账号、开放进度和工作区设置。
    teaching_use: 在原聊天提出纠错和状态更新，让基本操作贯穿小案例，而不是另列功能清单。
  teaching_sequence:
  - 说明整理目标、发送要求、查看过程与输出，再从文件检查关键事实。
  - 在原聊天提出纠错和状态更新，让基本操作贯穿小案例，而不是另列功能清单。
  defer:
  - 不提前引入技能、自动化、Git恢复或复杂编程。
  case_plan: 沿用已有提示词和v1/v2材料；新增解释不声称重新做过GUI案例。
