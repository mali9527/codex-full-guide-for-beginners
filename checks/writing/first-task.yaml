  reader_start:
  - 已准备我的待办项目，学过路径、Local、当前权限和一次消息的等待/完成。
  - 短消息只产生回复；尚未生成结果文件夹、v1或v2，不能假定已有。
  explain_now:
  - 电脑查看原件与让Codex读取是两次不同动作
  - 在新任务重新核对设置，而不假定继承上一任务
  - 纠错示例为有错误才执行的分支
  - v1存在且检查完成后才改v2，保存结束后才打开
