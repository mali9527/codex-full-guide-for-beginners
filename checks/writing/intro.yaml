study_brief:
  mode: revision
  prepared_on: '2026-09-28'
  base_manuscript_sha256: 0f2303b6ad687fce01f6fd8334121b3c9193fc52b30586d3c7bea84badd88269
  reader_goal: 读者看清Codex的价值、主要能力与应用场景，能想到自己可以交给它的事；了解本书从基础操作到网页工具的路线。
  reader_start:
  - 没有前章；会办公软件但不懂Codex或编程。
  explain_now:
  - 自然语言可以成为执行要求，应用能调用文件及工具完成工作。
  - 日常资料、表格和网站/工具分别解决什么问题；生成结果仍需人决定是否适用。
  official_readings:
  - fact_id: desktop-entry
    url: https://learn.chatgpt.com/docs/quickstart
    locator: Setup / Start a chat
    checked_on: '2026-09-28'
    understanding: 官方把Chat、Work和Codex区分；本书使用Codex入口连接文件。
    teaching_use: 简述Work的用途避免把办公能力说成Codex独占；按既定路线继续Codex。
  - fact_id: local-project-context
    url: https://learn.chatgpt.com/docs/projects
    locator: Use local projects for folders and codebases
    checked_on: '2026-09-28'
    understanding: 本地项目连接真实文件；目录组织与访问保护不是同一件事。
    teaching_use: 用成果落盘建立工具认识，不将对话答案当文件。
  - fact_id: desktop-model-control
    url: https://learn.chatgpt.com/docs/models
    locator: Choose a model（desktop）；Recommended models中的权限条件
    checked_on: '2026-09-28'
    understanding: 模型控件在输入区，换模型不会获得新工作区权限。
    teaching_use: 只解释角色，不固定当前型号或讨论参数。
  - fact_id: permission-boundary
    url: https://learn.chatgpt.com/docs/permission-modes
    locator: Ask for approval / How permissions work
    checked_on: '2026-09-28'
    understanding: 文件行动有范围；材料可否交给服务处理仍需用户判断。
    teaching_use: 写授权范围，不作离线或绝不越界保证。
  - fact_id: codex-work-scenarios
    url: https://learn.chatgpt.com/docs/use-chatgpt
    locator: Work/Codex桌面对照与自然语言反馈
    checked_on: '2026-09-28'
    understanding: Codex与Work的桌面能力有重叠，Codex可用于研究、文档、演示文稿及其他知识工作，也提供开发视图；自然语言要求可随结果继续修订。文件、联网、工具等能力取决于平台、账号、开放进度和工作区设置。
    teaching_use: 能力有概念后再说明桌面/Codex入口与模型；最后给后续阅读方向，检查方法放入案例。
  - fact_id: artifact-preview
    url: https://learn.chatgpt.com/docs/artifacts-viewer
    locator: Work with files开篇
    checked_on: '2026-09-28'
    understanding: 桌面支持文档、表格、演示文稿和PDF等成果的可视预览，并可在支持批注的预览上标注；CLI可生成和修改文件，但不提供同样的预览与批注界面。
    teaching_use: 能力有概念后再说明桌面/Codex入口与模型；最后给后续阅读方向，检查方法放入案例。
  teaching_sequence:
  - 先解释减少资料到成品之间的手工转换，再给文档/表格/研究/网页工具的具体任务。
  - 能力有概念后再说明桌面/Codex入口与模型；最后给后续阅读方向，检查方法放入案例。
  defer:
  - 预算计算细节、安装步骤、权限档位和开发术语后置。
  case_plan: 自编场景只示意用途，不声称已演示；待办案例只在章尾引入，不垄断开篇。
