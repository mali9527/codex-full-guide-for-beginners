study_review:
  result: pass
  reason: 先展示自有清单与可手算的预算目标，再解释应用/入口/模型；官方的本地文件和授权范围转化为人应检查落盘与事实的讲解，CLI/Git未前置。
reader_review:
  prior_knowledge:
    result: pass
    reason: 从零开始解释模型、程序与入口，未依赖未写章节；读者已有文件操作经验，没有拆解常见按键或解压。
  concept_timing:
    result: pass
    reason: 清单和预算先给用途，随后解释程序与模型；权限具体设置留给选文件夹时，不在第1章列所有模式。
  information_value:
    result: pass
    reason: 保留待办不等于代办、数字与完成标准两个判断；模型参数和费用均后置。
  natural_style:
    result: pass
    reason: 从看得见的文件过渡到能计算的工具，未虚构作者经历；例子承担说明而非空泛安抚。
  localization:
    result: pass
    reason: 使用「」；金额不绑定币种，默认日期为自编材料的日期；真实产品名称保留。
  independent_creation:
    result: pass
    reason: 与本批实际选读的教程对照，未复用网站、磁盘清理、md2html案例；预算数值自行设定，清单来自本书自有素材。
