    locator: Use local projects；Start without a project
    checked_on: '2026-09-29'
    understanding: 项目组织和本地访问不同，空任务不需先创建项目。
    teaching_use: 解释文件在电脑不等于已提供给当前任务。
  - fact_id: desktop-entry
