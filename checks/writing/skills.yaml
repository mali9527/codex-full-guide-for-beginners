  base_manuscript_sha256: b92af40bdc9f6ebc2b7bc453fbe266d6b09c8c284afd23973fa8658995d32675
  reader_goal: 能判断一套做法是否值得存成Skill，找到并选择已有技能，用$skill-creator创建、试用、修改和停用自己的技能。
  reader_start:
  - 已有跑通并核对过的清单整理流程；已会写项目说明。
  explain_now:
  - 技能复用的是做法
  - 描述决定何时被选用
  - 选中入口出现不等于结果有效
  official_readings:
  - fact_id: skills-plugins
    url: https://learn.chatgpt.com/docs/build-skills
    locator: 创建、结构、发现与调用设置
    checked_on: '2026-09-29'
    understanding: 技能是含SKILL.md的目录，需name与description；个人技能存于用户目录下的技能文件夹，改动自动发现，未出现时重启；先载入名称与描述，选用时再读全文；可设为仅显式调用；优先写指令而非脚本。
    teaching_use: 创建请求只用自然语言，检查路径写死、擅自补日期等问题。
  - fact_id: skill-invocation-surface
    url: https://learn.chatgpt.com/docs/skills-and-plugins
    locator: 调用符号与创建入口
    checked_on: '2026-09-28'
    understanding: Codex用$点名技能，ChatGPT用@；也可按描述自动匹配。
    teaching_use: 先看已有技能，再创建。
  teaching_sequence:
  - 值得做成技能的条件→侧栏Skills与$菜单查看已有
  - $skill-creator描述已跑通的流程→读草稿→保存并确认出现
  - 新任务试用并按第4章事实核对→修改、停用、更新
  defer:
  - 插件留第21章
  - 录制并重放仅一句
  case_plan: 拟名notes-to-todos的个人技能，为本例名称；材料仍是两份备忘。
