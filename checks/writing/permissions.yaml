study_brief:
  mode: revision
  prepared_on: '2026-09-29'
  base_manuscript_sha256: 344a24d5dc9fdfad5ebc2b1b077d4ee78ef07ea46c34acedd53ba95a6e5afbb5
  reader_goal: 能说出三种权限模式的区别并在任务中选定，读懂一条批准请求的对象与动作，知道拒绝后怎样继续。
  reader_start:
  - 第3、4章已在输入框下方选过Ask for approval。
  explain_now:
  - 权限允许什么与这次应该做什么
  - 启用模式与在任务中选中
  - 系统授权、任务批准、外部服务授权三层
  - 托管搜索与本地命令联网
  official_readings:
  - fact_id: permission-boundary
    url: https://learn.chatgpt.com/docs/permission-modes
    locator: 三种模式；How permissions work
    checked_on: '2026-09-29'
    understanding: 沙箱定义可访问的文件和网络，批准决定何时停下；换审核者不扩大沙箱；启用模式只让它可选。
    teaching_use: 用「能做什么」与「这次该做什么」开头，三模式表后紧跟启用与选中。
  - fact_id: auto-review-routing
    url: https://learn.chatgpt.com/docs/sandboxing/auto-review
    locator: 审核范围、拒绝处理与/approve
    checked_on: '2026-09-28'
    understanding: 自动审核是换审核者而非扩权，可能出错；连续被拒会中止本轮；/approve只放行一次重试；电脑操作的应用授权仍直接问用户。
    teaching_use: 被拒以后一节写清先读原因、缩小范围，再谈/approve。
  - fact_id: hosted-search-boundary
    url: https://learn.chatgpt.com/docs/web-search
    locator: 托管搜索与沙箱网络
    checked_on: '2026-09-28'
    understanding: 网页搜索是托管工具，不走沙箱的网络代理与域名白名单。
    teaching_use: 用一段话说明能搜网页不代表本地命令已获准联网。
  teaching_sequence:
  - 从第4章没有逐步询问的经历进入→权限与任务要求→三模式表
  - Settings → General启用→回任务选中并核对
  - 请求出现时先看对象和动作→不懂先请它解释→批准后查结果、拒绝后给替代范围
  - 其他授权层→自动审核拒绝后的处理
  defer:
  - 电脑操作的系统授权细节留第23章
  - 插件连接留第21章
  case_plan: 自设情景：把核对后的清单复制到项目外的另一文件夹而触发请求；标明是说明判断方法的假设。
