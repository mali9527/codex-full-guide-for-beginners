reader_review:
  prior_knowledge:
    result: pass
    reason: 沿前章已选Ask，解释真正允许范围后再介绍可选切换，系统授权不当已具备。
  concept_timing:
    result: pass
    reason: 先设置启用→回当前任务选中；请求出现→读懂→批准/拒绝→检查执行结果。 全书衔接复核：全文回读：启用模式后回当前任务选中，批准/系统权限/服务连接分别解释；Enter/Esc限批准状态，/approve限适用最近拒绝。将「普通话」改为「日常语言」，不限定语言地区。
  information_value:
    result: pass
    reason: 不教config或绕限制；保留三层授权与托管搜索差异以解释实际困惑。
  natural_style:
    result: pass
    reason: 假设的跨目录请求标明示意，判断落到对象/动作，不伪造审批卡片。
  localization:
    result: pass
    reason: 真实英文模式名统一，中文批准与批注明确；组织限制不当个人操作失误。
  independent_creation:
    result: pass
    reason: 原创复制清单情境，未复制官方安全案例/策略/配置；无假实测。
fact_review:
  coverage: reviewed
  reason: 通读固定章稿与review-packet，逐项反查产品动作、选项、条件和保证性措辞；下列锚点覆盖实际用到的事实，原创提示词和判断示例另作意图/来源对照。未把文档支持、AI审稿或文件演示当成GUI操作通过。
    本轮对当前关联事实扩展的影响已复核：快捷键事实扩展不改变先前按键；新材料只影响第17/18章示例；平台条件仍按各条真实来源。已有安装与前四章来源保持原核对日期，不宣称本轮重读全部旧来源。
