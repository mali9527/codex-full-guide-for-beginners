study_brief:
  mode: revision
  prepared_on: '2026-09-29'
  base_manuscript_sha256: 936a7cea9c4815adbfa3087d92740f9efc651be5b4391e5e6c8461ff72bd07ce
  reader_goal: 能判断任务现在在等谁，会用Steer补充、用Queue排队，知道怎样要求停下并核对已留下的文件，会用侧聊、通知和可选语音。
  reader_start:
  - 已会发送、保存、选模型与权限、处理批准请求。
  explain_now:
  - 计划、过程、等待与结果的区别
  - Steer与Queue
  - 停止请求与撤销修改是两件事
  - 侧聊不改变主任务
  official_readings:
  - fact_id: desktop-followup-behavior
    url: https://learn.chatgpt.com/docs/prompting
    locator: Steering and queuing
    checked_on: '2026-09-29'
    understanding: Steer把消息加入当前运行，Queue留待下一轮；默认在Settings > General > Follow-up behavior，并显示临时改用另一种行为的快捷键；排队消息在输入框上方可编辑、排序、发送或删除。该节没有关于停止运行的说明。
    teaching_use: 停止仍按Steer送入停止要求来教，并明确不保证即时中断。
  - fact_id: desktop-file-shortcuts
    url: https://learn.chatgpt.com/docs/reference/commands
    locator: 快捷键表
    checked_on: '2026-09-29'
    understanding: 页面没有停止、中断或取消运行的快捷键；批准与拒绝键仅在请求打开时适用。
    teaching_use: 正文不写停止按钮或按键，缺口留在操作证据清单。
  - fact_id: desktop-notification-activity
    url: https://learn.chatgpt.com/docs/notifications
    locator: 通知类型与Activity
    checked_on: '2026-09-29'
    understanding: 可分别设置完成、权限请求和提问提醒；Activity显示未读、运行中或等待回应的任务。
    teaching_use: 通知一节写设置入口和铃铛，不把提醒当成成果正确。
  - fact_id: desktop-voice-options
    url: https://learn.chatgpt.com/docs/features/voice
    locator: 听写与语音对话
    checked_on: '2026-09-28'
    understanding: 语音对话用于实时交流，听写只转文字；屏幕上下文限macOS；语音限Plus及以上并逐步开放。
    teaching_use: 语音作为可选段，结束语音与停止任务分开。
  teaching_sequence:
  - 读最新消息判断状态→状态表
  - 需要补充→先看Follow-up behavior→回原任务发送→看消息进了当前运行还是队列
  - 方向不对→清理队列→用Steer发停止要求→等确认→到文件夹核对→再决定恢复或继续
  - 侧聊→失败后的接续→通知与Activity→可选语音
  defer:
  - Goal暂停留第17章，定时暂停留第24章
  - 普通任务的直接停止控件缺官方说明与实机证据，不写入正文
  case_plan: 沿用四项待办与保存失败的自设情景；不展示虚构的运行日志或耗时。
