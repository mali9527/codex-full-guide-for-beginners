  reader_goal: 理解长任务中哪些信息仍需显式保留，正确用compact与fork。
  reader_start:
  - 已学任务/文件分离、status及接续说明；没学上下文窗口。
  explain_now:
  - 模型当前可处理的信息有限
  - 自动/手动压缩不增加账号额度
  - 分支任务和文件副本不同
  official_readings:
  - fact_id: context-compact-fork
    url: https://learn.chatgpt.com/docs/reference/slash-commands
    locator: status/compact/fork
    checked_on: '2026-09-29'
    understanding: 手动压缩和新分支作用对象是任务上下文，不能当备份。
    teaching_use: 先保存关键条件和当前文件路径，压缩后复述核对；同目录分支先另存。
  - fact_id: context-compact-fork
    url: https://learn.chatgpt.com/docs/config-file/config-reference
    locator: model_auto_compact_token_limit; model_context_window
    checked_on: '2026-09-29'
    understanding: 系统支持自动压缩且与模型阈值相关，不能编固定比例。
    teaching_use: 用容量概念解释而不教配置数值。
  teaching_sequence:
  - 发现冗长/遗漏→核对当前材料和要求→保存接续说明→按需要compact→核对关键约束
  - 尝试另一方案→先保存副本→fork并检查项目目录→给新方案不同输出名
  defer:
  - 记忆与项目持久说明第19章
  - 不教工作树创建操作
  case_plan: 同一清单按日期或按负责人排版的分支比较，不让两个任务覆盖同一文件。
