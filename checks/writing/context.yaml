    teaching_use: 用容量概念解释而不教配置数值。
  teaching_sequence:
  - 发现冗长/遗漏→核对当前材料和要求→保存接续说明→按需要compact→核对关键约束
  - 尝试另一方案→先保存副本→fork并检查项目目录→给新方案不同输出名
