  concept_timing:
    result: pass
    reason: 先下载登录再认识界面；第3章才实际连接文件夹，Local和权限此处只给用途。
  information_value:
    result: pass
    reason: 直接下载、官方备用入口和界面各区分工均帮助当前动作；全设置、套餐和开发工具后置。
  natural_style:
    result: pass
    reason: 界面按一次工作顺序展开，每项说明用途；表格仅比较选项与排障，删除Mac重复安装句。
  localization:
    result: pass
    reason: 两平台分支不以替换快捷键冒充；保留真实英文按钮，没有泛化某账号模型。
  independent_creation:
    result: pass
    reason: 官方文档确定入口，教程只启发教学次序；未复用旧菜单清单、下载器、个人经历或截图。
fact_review:
  coverage: reviewed
  reason: 完整回读本章及递归前置，核对价值场景/入口/平台/模型/项目/Local/权限/预览/快捷键等实际出现的断言；保留条件，不用来源链接代替语义对照。自编案例与提示词是需求和教学建议，未冒充已执行的产品保证。文档未验证界面操作或读者理解。
