study_brief:
  mode: revision
  prepared_on: '2026-09-29'
  base_manuscript_sha256: 10e46b461b70a51906a8a11b305dd051545d7bf255f0fea67b4758e30fecd05f
  reader_goal: 读者能找到自己平台的官方包并理解登录与Windows首设，知道遇到不同故障到哪里核对。
  reader_start:
  - 第1章已说明应用、入口及工具；本章不假定终端或开发工具经验。
  explain_now:
  - ChatGPT桌面应用与Codex入口的名称关系
  - ChatGPT账号和API登录的区别
  - Windows首次沙箱为何需要管理员
  - 自动更新与组织更新控制
  official_readings:
  - fact_id: desktop-download-routes
    url: https://learn.chatgpt.com/docs/app
    locator: Download for macOS (Apple Silicon)
    checked_on: '2026-09-29'
    understanding: Mac包与兼容条件明确，页面新名称与包内旧名称可能并存。
    teaching_use: 说明按官方平台入口选择，保留链接失败兜底。
  - fact_id: windows-native
    url: https://learn.chatgpt.com/docs/windows/windows-app
    locator: Native sandbox；Windows-native default
    checked_on: '2026-09-29'
    understanding: 可以原生使用，不强制WSL或开发工具。
    teaching_use: 一般安装与开发环境加装分开。
  - fact_id: windows-first-setup
    url: https://learn.chatgpt.com/docs/windows/windows-sandbox
    locator: Version matrix；environment assumptions；Troubleshooting
    checked_on: '2026-09-29'
    understanding: 操作限制由沙箱承担，初始配置需批准，设备策略可能拦截。
    teaching_use: 讲清为什么出现Set up，补winget缺失和组织失败下一步。
  - fact_id: sign-in-options
    url: https://learn.chatgpt.com/docs/auth
    locator: Desktop sign-in；Check authentication
    checked_on: '2026-09-29'
    understanding: 浏览器认证返回应用才构成桌面登录；另有API路径。
    teaching_use: 围绕登录现象说明，不教密钥或终端。
  - fact_id: desktop-update-policy
    url: https://learn.chatgpt.com/docs/enterprise/manage-app-updates
    locator: Default updater；Verify managed setting
    checked_on: '2026-09-29'
    understanding: 一般自动更新，菜单存在不代表组织允许。
    teaching_use: 新增日后维护与查Managed的短段；不编造About位置。
  - fact_id: desktop-file-shortcuts
    url: https://learn.chatgpt.com/docs/reference/settings
    locator: Open Settings；Keyboard shortcuts
    checked_on: '2026-09-29'
    understanding: 设置有两平台快捷键，并可查绑定。
    teaching_use: 为入口不显眼提供可查替代路径。
  - fact_id: mac-open-installer
    url: https://support.apple.com/en-au/guide/mac-help/-mh35835/mac
    locator: 前批实际阅读Apple安装或About This Mac芯片段，本次复用
    checked_on: '2026-09-27'
    understanding: Mac从互联网取得的磁盘映像或安装包可打开后按提供的安装引导操作；应用安装动作不等于完成产品登录。
    teaching_use: Mac常规动作保持原范围；没有重新联网阅读或执行安装。
  - fact_id: mac-identify-chip
    url: https://support.apple.com/en-au/116943
    locator: 前批实际阅读Apple安装或About This Mac芯片段，本次复用
    checked_on: '2026-09-28'
    understanding: Apple菜单的关于本机可查看芯片或处理器；Apple Silicon机型显示Chip及芯片名，Intel机型显示Processor及Intel处理器名。
    teaching_use: Mac常规动作保持原范围；没有重新联网阅读或执行安装。
  teaching_sequence:
  - 按平台提供直接入口和支持条件
  - Windows和Mac各自说明准备与首次访问
  - 浏览器认证后回应用确认账号
  - 选择Codex、打开设置和核对更新
  - 按停住位置给排障
  defer:
  - winget命令安装教程
  - API密钥创建
  - 企业管理策略编辑
  - 未经实机确认的About菜单层级
  case_plan: 不伪造安装经历或拖放截图；按官方真实标签给步骤，winget只在该错误出现时解释用途与官方排障入口。
