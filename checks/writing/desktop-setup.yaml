    locator: 本轮或已登记近7日阅读中与本章有关的主体段落；具体范围见事实来源和参考来源与致谢
    checked_on: '2026-09-28'
    understanding: Windows桌面支持原生运行；原生沙箱初次设置可能需要管理员批准，受管理环境可能受限；不等于日常都以管理员身份运行。
    teaching_use: 只讲本章当前动作所需部分；保持文档与GUI实测、教学建议与产品保证的区分。
