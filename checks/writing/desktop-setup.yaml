  reader_goal: 按安装→登录→返回应用→进入Codex的主线准备好；Windows本地设置仅在出现提示时进入并返回。
  reader_start:
  - 第1章已解释桌面应用、Codex入口和模型不同；读者尚未完成安装登录，也未连接目录。
  explain_now:
  - 平台安装分支与共同登录主线
  - Windows沙箱是条件设置，不固定置于登录之前
  - 第2章结束只进入Codex，第3章在明确项目后创建首次任务
  official_readings:
  - fact_id: desktop-entry
    url: https://learn.chatgpt.com/docs/quickstart
    locator: Setup / Start a chat
    checked_on: '2026-09-29'
    understanding: 先安装登录，再选择工作位置和开始任务；不同入口不混成固定点击过程。
    teaching_use: 据当前操作依赖重排，具体顺序见teaching_sequence；无新GUI实测。
  - fact_id: sign-in-options
    url: https://learn.chatgpt.com/docs/auth
    locator: Sign in with ChatGPT / desktop app
    checked_on: '2026-09-29'
    understanding: 浏览器身份认证后要返回应用确认，不把身份与本地环境混成一步。
    teaching_use: 据当前操作依赖重排，具体顺序见teaching_sequence；无新GUI实测。
  - fact_id: windows-first-setup
    url: https://learn.chatgpt.com/docs/windows/windows-sandbox
    locator: Configure the Windows sandbox
    checked_on: '2026-09-29'
    understanding: Set up属于本地运行配置；源码/开发环境分支不移用为安装必做。
    teaching_use: 据当前操作依赖重排，具体顺序见teaching_sequence；无新GUI实测。
  teaching_sequence:
  - 选择对应平台安装包→完成安装并打开应用；不同时走两平台
  - 在浏览器登录→返回应用确认账号（本章登录节）→进入Codex；此时还未要求在空位置发消息
  - 开始本地工作如遇Set up→阅读本章条件分支并设置→返回第3章原任务
  defer:
  - 后续章节的完整档位策略、队列控制与高级项目管理
  - 正在运行时停止入口尚无双平台真实依据；本轮未找到可确认桌面普通任务停止键的文档，保留原操作清单缺口，不移植CLI或猜按钮。
  case_plan: 保留两份短备忘、四项待办和v1/v2；第3章水杯/还书请求不变。审阅进入与返回、条件分支与文件是否已生成，不增加案例和电脑常识。
