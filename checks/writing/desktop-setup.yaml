  reader_start:
  - 第1章已说明应用、入口及工具；本章不假定终端或开发工具经验。
  explain_now:
  - ChatGPT桌面应用与Codex入口的名称关系
  - ChatGPT账号和API登录的区别
  - Windows首次沙箱为何需要管理员
  - 自动更新与组织更新控制
  official_readings:
  - fact_id: desktop-download-routes
    url: https://learn.chatgpt.com/docs/app
    locator: Download for macOS (Apple Silicon)
    checked_on: '2026-09-29'
    understanding: Mac包与兼容条件明确，页面新名称与包内旧名称可能并存。
    teaching_use: 说明按官方平台入口选择，保留链接失败兜底。
  - fact_id: windows-native
    url: https://learn.chatgpt.com/docs/windows/windows-app
    locator: Native sandbox；Windows-native default
    checked_on: '2026-09-29'
    understanding: 可以原生使用，不强制WSL或开发工具。
    teaching_use: 一般安装与开发环境加装分开。
  - fact_id: windows-first-setup
    url: https://learn.chatgpt.com/docs/windows/windows-sandbox
    locator: Version matrix；environment assumptions；Troubleshooting
    checked_on: '2026-09-29'
