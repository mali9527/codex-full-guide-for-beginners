    url: https://learn.chatgpt.com/docs/windows/windows-sandbox
    locator: Configure / Windows version matrix
    checked_on: '2026-09-28'
    understanding: Windows原生沙箱推荐Windows 11；新且完整更新的Windows 10为best effort，实际最低需1809。推荐elevated需要管理员批准设置；受组织策略约束；unelevated为较弱后备方案。
      官方另将winget可用列为环境假定，缺失时需更新Windows或补Windows程序包管理器。
    teaching_use: 只讲本章当前动作所需部分；保持文档与GUI实测、教学建议与产品保证的区分。
