  reader_goal: 能选对下载入口完成安装和登录，进入Codex；遇到Windows首次设置、更新受管理或登录未返回时知道查哪里。
  reader_start:
  - 已知道应用、入口和模型的区别；会下载安装普通软件。
  explain_now:
  - 浏览器登录后要回应用确认
  - 账号工作区与电脑文件夹不是一回事
  - 沙箱是首次本地工作时的运行限制
  official_readings:
  - fact_id: windows-first-setup
    url: https://learn.chatgpt.com/docs/windows/windows-sandbox
    locator: 首次设置、管理员批准与受管设备
    checked_on: '2026-09-26'
    understanding: 原生沙箱依赖管理员批准的初次设置，会出现系统提权提示；受管设备可能被策略阻止；日常运行不需要管理员权限。
    teaching_use: Windows设置写成出现提示才处理的条件分支，完成后回到原任务。
  - fact_id: desktop-entry
    url: https://learn.chatgpt.com/docs/quickstart
    locator: Setup；Start a chat
    checked_on: '2026-09-25'
    understanding: 桌面应用登录后从ChatGPT下拉选择Codex，再开始聊天。
    teaching_use: 登录与进入Codex连续讲，模型选择后置。
  teaching_sequence:
  - 按电脑选官方下载→安装→打开应用
  - Continue to sign in→浏览器登录→回应用确认账号与工作区
  - 下拉选择Codex→认出New chat→进入第3章
  - 条件分支：Windows出现Set up提示时设置并回原任务；设置与更新入口；按停住的位置排查
  defer:
  - 权限模式选择留第7章
  - 额度留第5章
  case_plan: 本章无案例文件；以读者自己的电脑为对象。修订只收紧重复提醒，不新增未核对的界面描述。
