    url: https://learn.chatgpt.com/docs/app
    locator: Download links
    checked_on: '2026-09-28'
    understanding: 官方桌面页的Mac下载标Apple Silicon；Windows应用页链接Microsoft分发入口。两个平台需使用各自下载路线，不把Mac下载包通用于Windows或Intel Mac。 2026-09-28实际点击官方Mac下载链接，目标为persistent.oaistatic.com/codex-app-prod/Codex.dmg；页面工具不支持二进制，不等于下载或安装成功。
    teaching_use: 只讲本章当前动作所需部分；保持文档与GUI实测、教学建议与产品保证的区分。
  - fact_id: windows-native
