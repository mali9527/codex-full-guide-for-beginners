    understanding: 当前官方快速开始在ChatGPT桌面应用的ChatGPT下拉菜单中提供Codex入口。 同页区分Chat、Work与Codex用途；Work面向研究分析和文档，Codex面向开发和文件工作，CLI是另一使用入口。
    teaching_use: 只讲本章当前动作所需部分；保持文档与GUI实测、教学建议与产品保证的区分。
