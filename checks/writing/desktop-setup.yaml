    understanding: 设置有两平台快捷键，并可查绑定。
    teaching_use: 为入口不显眼提供可查替代路径。
  - fact_id: mac-open-installer
    url: https://support.apple.com/en-au/guide/mac-help/-mh35835/mac
    locator: 前批实际阅读Apple安装或About This Mac芯片段，本次复用
    checked_on: '2026-09-27'
    understanding: Mac从互联网取得的磁盘映像或安装包可打开后按提供的安装引导操作；应用安装动作不等于完成产品登录。
    teaching_use: Mac常规动作保持原范围；没有重新联网阅读或执行安装。
  - fact_id: mac-identify-chip
    url: https://support.apple.com/en-au/116943
