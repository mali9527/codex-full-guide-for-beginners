    checked_on: '2026-09-27'
    understanding: 原生Windows路线不要求先配WSL；开发工具列表是按用途准备。
    teaching_use: Windows首例只安装桌面应用，Git等不变成前置。
  - fact_id: windows-first-setup
    url: https://learn.chatgpt.com/docs/windows/windows-sandbox
