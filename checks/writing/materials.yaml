  reader_goal: 能按任务选择材料入口，并确认读到的范围。
  reader_start:
  - 已知本地项目、路径和第一份清单，未使用@或Appshot。
  explain_now:
  - 粘贴/引用文件/图片/链接各自用途
  - 相对路径依赖当前文件夹
  - Appshot捕获范围、目的地和授权
  official_readings:
  - fact_id: local-project-context
    url: https://learn.chatgpt.com/docs/environments/modes
    locator: Local; @
    checked_on: '2026-09-29'
    understanding: 可引用文件并不表示所有目录都已读入。
    teaching_use: 先确认项目再@选文件，要求报告读取范围。
  - fact_id: desktop-image-input
    url: https://learn.chatgpt.com/docs/image-inputs
    locator: Desktop image inputs
    checked_on: '2026-09-29'
    understanding: 图像要配观察要求，拖入后的附件应检查。
    teaching_use: 先无隐私图片，再Shift拖入并核对附件。
  - fact_id: appshot-input-scope
    url: https://learn.chatgpt.com/docs/appshots
    locator: Capture; destination; permissions
    checked_on: '2026-09-29'
    understanding: 窗口截图与可访问文本范围不同；默认目的地可能新任务。
    teaching_use: 捕获前选目的地，捕获后查附件与任务，不假定整页已读。
  teaching_sequence:
  - 选要处理的副本→确认本地项目和当前目录→按材料类型添加→检查附件或明确路径→让Codex先说明实际读到什么
  - 可选Appshot先选窗口和目的地，再热键/授权，最后核对附件与范围
  defer:
  - 多应用操控第23章
  - 不教终端路径命令
  case_plan: 同一备忘补充一张无敏感内容图片；重点比较材料范围，不新增业务案例。
