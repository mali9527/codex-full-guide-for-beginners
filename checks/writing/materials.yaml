    result: pass
    reason: 回查并改正Appshot设置位置，不借浮动宠物承担未教前置；读取范围先确认再生成。 全书衔接复核：对最终Appshot修正段与前后章回读：Settings选择目的地后返回接收任务，浮动控件位置不冒充该设置；附件/路径/快照不等于批量访问授权，第22章才进入网页操作。
  information_value:
    result: pass
    reason: 每种输入有实际用途，路径只作必要解释，不重教下载/解压。
  natural_style:
