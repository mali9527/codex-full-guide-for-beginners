    reason: 先材料用途再入口与局限，示例围绕熟悉清单，无机械每键拆解。
  localization:
    result: pass
    reason: 双Command/双Alt、Mac系统授权与正文英文设置名称分别核对。
  independent_creation:
    result: pass
    reason: 使用自编清单和局部检查请求，不采用官网预算/邮件/开发案例。
