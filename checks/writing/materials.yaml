study_brief:
  mode: revision
  prepared_on: '2026-09-29'
  base_manuscript_sha256: 6f97b030176cd5d1617693726669ea87e10199550ac80c4b30bd8f5e0ccd0749
  reader_goal: 能按材料所在位置选择粘贴、文件引用、图片、链接或应用快照，并在开始加工前确认实际读到了什么。
  reader_start:
  - 已会在本地项目中读写文件；知道路径是文件地址。
  explain_now:
  - 相对路径依赖共同起点
  - 选到文件与读完文件
  - 图片需要观察目标
  - 应用快照给的是材料不是控制权
  official_readings:
  - fact_id: appshot-input-scope
    url: https://learn.chatgpt.com/docs/appshots
    locator: 捕获范围、热键、目的地与权限
    checked_on: '2026-09-29'
    understanding: 只捕获最前方窗口，可含截图与可取得文本；默认热键为Mac两侧Command、Windows两侧Alt；目的地有Current
      chat、New chat、Automatic，Automatic在60秒内交互过的任务会续用；部分应用只给可见截图。
    teaching_use: 先定目的地再捕获，回任务核对附件后再提要求。
  - fact_id: desktop-image-input
    url: https://learn.chatgpt.com/docs/image-inputs
    locator: 桌面添加图片与说明建议
    checked_on: '2026-09-29'
    understanding: 按住Shift把图片拖入输入区；说明图片显示什么、看哪里、要什么结果。
    teaching_use: 图片一节围绕观察目标写。
  - fact_id: local-run-mode
    url: https://learn.chatgpt.com/docs/environments/modes
    locator: Local与@文件
    checked_on: '2026-09-29'
    understanding: Local直接在当前项目目录工作；输入区提示用@添加文件。
    teaching_use: 文件引用放在材料选择表之前。
  teaching_sequence:
  - 先决定交哪一种材料→选择表
  - 位置从共同起点说起→先问当前工作文件夹
  - 先确认读到的内容→图片与观察目标
  - 应用快照：定目的地→切到目标窗口→捕获→回任务核对
  - 链接与隐私提醒→出问题时的定位次序
  defer:
  - 联网查证留第11章
  - 操作应用留第23章
  case_plan: 沿用「我的待办」材料与自设截图情景；不使用真实私人内容。
