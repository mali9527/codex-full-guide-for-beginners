  reader_goal: 能决定继续原任务还是另开，给任务起名、置顶、搜索、归档和恢复，离开前留下接续说明。
  reader_start:
  - 已有一个项目和至少一个完成的任务。
  explain_now:
  - 项目与任务各保留什么
  - 同项目任务共用文件但不共用交流记录
  - 主要文件夹
  - 归档不是备份
  official_readings:
  - fact_id: desktop-chat-retrieval
    url: https://learn.chatgpt.com/docs/projects
    locator: Organize projects and chats / app
    checked_on: '2026-10-04'
    understanding: 桌面归档从Settings进入Archived chats；网页分支不写成备用桌面路径。
    teaching_use: 桌面归档从Settings进入Archived chats；网页分支不写成备用桌面路径。
  teaching_sequence:
  - 同一成果留在原任务→独立成果另开任务
  - 新任务先核对工作位置→命令入口
  - 多文件夹与主要位置→起名、置顶、搜索
  - 归档与恢复→离开前的接续说明→回来先看实际文件
  - 桌面归档从Settings进入Archived chats；网页分支不写成备用桌面路径。
  defer:
  - 上下文与分支留第13章
  - 本版不要求双平台实测；未测记录独立保留。未获证实的控件位置不补猜。
  case_plan: 沿用待办清单与自设的资料查证任务名。
