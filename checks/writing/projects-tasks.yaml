  teaching_sequence:
  - 同一成果留在原任务→独立成果另开任务
  - 新任务先核对工作位置→命令入口
  - 多文件夹与主要位置→起名、置顶、搜索
  - 归档与恢复→离开前的接续说明→回来先看实际文件
  - 桌面归档从Settings进入Archived chats；网页分支不写成备用桌面路径。
