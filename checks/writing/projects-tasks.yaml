  reader_start:
  - 已有一个项目和至少一个完成的任务。
  explain_now:
  - 项目与任务各保留什么
  - 同项目任务共用文件但不共用交流记录
  - 主要文件夹
  - 归档不是备份
  official_readings:
  - fact_id: desktop-chat-retrieval
    url: https://learn.chatgpt.com/docs/projects
    locator: Organize chats；归档恢复路径
    checked_on: '2026-09-29'
    understanding: 项目页写恢复路径为Settings > Data Controls > Archived chats；设置参考页把Archived
      chats列为一个分区。两页写法不同。
    teaching_use: 正文写「在Settings里找Archived chats，没有直接看到就到Data Controls里找」，并登记冲突。
  - fact_id: desktop-project-task-commands
    url: https://learn.chatgpt.com/docs/reference/slash-commands
    locator: /project、/task、/local
    checked_on: '2026-09-28'
    understanding: 三个命令分别选项目、开无项目任务、选本地运行。
    teaching_use: 命令表保留，强调选完仍要核对显示。
  - fact_id: local-project-context
    url: https://learn.chatgpt.com/docs/projects
    locator: Primary与secondary folders
    checked_on: '2026-09-29'
    understanding: 新任务从主要文件夹开始；次要文件夹不自动发现项目文件。
    teaching_use: 多文件夹一节保持简短。
  teaching_sequence:
  - 同一成果留在原任务→独立成果另开任务
  - 新任务先核对工作位置→命令入口
  - 多文件夹与主要位置→起名、置顶、搜索
  - 归档与恢复→离开前的接续说明→回来先看实际文件
  defer:
  - 上下文与分支留第13章
  case_plan: 沿用待办清单与自设的资料查证任务名。
