study_brief:
  mode: revision
  prepared_on: '2026-09-29'
  base_manuscript_sha256: db7137d51a197df3871613bbe636f2a6df294dbd49a78f25742d464d07ef7de8
  reader_goal: 能区分内置浏览器与已有标签两条路线，完成一次只读查看，管理网站许可，连接失败时知道查哪一层。
  reader_start:
  - 已会联网查证与安装插件；已懂批准请求。
  explain_now:
  - 两种浏览器环境的登录状态不同
  - 网站许可与页面动作分开
  - 页面批注
  official_readings:
  - fact_id: browser-boundary
    url: https://learn.chatgpt.com/docs/browser
    locator: 内置浏览器、独立资料与限制
    checked_on: '2026-09-27'
    understanding: 内置浏览器使用与常用浏览器分开的资料，不共享标签与登录；CLI与编辑器扩展没有它。
    teaching_use: 先认识内置浏览器再讲扩展。
  - fact_id: browser-boundary
    url: https://learn.chatgpt.com/docs/chrome-extension
    locator: 支持浏览器、安装与权限
    checked_on: '2026-09-28'
    understanding: 支持Chrome、Edge、Brave、Opera、Vivaldi；在Settings > Computer Use选浏览器并安装插件与扩展，显示Manage后用@选择；Opera不支持侧聊。
    teaching_use: 安装步骤后先让它报告页面标题与地址。
  teaching_sequence:
  - 先决定用哪条路线→@Browser只读打开官方页→核对地址标题
  - 网站许可与页面动作→下载与上传边界
  - 扩展：设置→安装→Manage→新任务@选择→报告页面
  - 只交需要的页面→页面批注→连接不上时的排查
  defer:
  - 操作其他应用留第23章
  case_plan: 以官方项目说明页为只读对象；不恢复网页制作内容。
