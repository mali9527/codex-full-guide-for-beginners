  mode: revision
  prepared_on: '2026-09-29'
  base_manuscript_sha256: 2dc7ddd3b0369d171dae5f323123c601682e9e3fc567e0a2a14fce1c1dfbeaaf
  reader_goal: 能把一项已手动跑通的只读检查设为定时，核对保存的安排与首轮结果，并会修改、暂停、恢复和删除。
  reader_start:
  - 已会用Goal与反馈；有可检查的当前清单。
  explain_now:
  - Goal、提醒与周期执行的区别
  - 回原任务还是独立运行
  - 本地运行条件
  official_readings:
  - fact_id: scheduled-local
    url: https://learn.chatgpt.com/docs/automations
    locator: 本地条件与管理
    checked_on: '2026-09-27'
    understanding: 需要本地文件的任务要求电脑开着、应用运行、项目文件夹可访问；CLI没有Scheduled管理界面；网页任务不能直接在电脑文件夹里工作。
    teaching_use: 先手动跑通，再定时；本地条件单列一节。
  - fact_id: scheduled-chat-destination
    url: https://learn.chatgpt.com/docs/automations
    locator: 目的地与查看
    checked_on: '2026-09-27'
    understanding: 可回到原任务或每次独立运行，在Scheduled查看。
    teaching_use: 本例选独立运行并说明理由。
  teaching_sequence:
  - 先手动完成同样一次→写清每次做什么
  - 选目的地→用对话建立安排→到Scheduled核对名称、频率、时区、下次时间
  - 本地条件→首轮运行后检查→更新、暂停、恢复、删除
  defer:
  - 技能调用为可选，不作前置
  case_plan: 每周一次只读核对待办清单与两份备忘；时区示例为自设。全书在此收束。
