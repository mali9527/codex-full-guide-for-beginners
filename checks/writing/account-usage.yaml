  reader_goal: 能确认当前账号与工作区，说出几种会员大致差在哪里，到用量页面和/status看懂剩余与重置，遇到限额提示知道分清原因和下一步。
  reader_start:
  - 已完成一次文件任务；会在输入框用斜线菜单。
  explain_now:
  - 会员档位差在用量、模型与管理功能
  - 窗口、每周限额、credits各指什么
  - token衡量的范围比打了多少字大
  - 达到限额时当前这一轮的处理
  official_readings:
  - fact_id: usage-windows-and-credits
    url: https://learn.chatgpt.com/docs/pricing
    locator: 套餐说明、用量表注释与常见问题
    checked_on: '2026-09-29'
    understanding: Work与Codex包含在Free、Go、Plus、Pro、Business、Edu、Enterprise各档；Pro为Plus的5倍或20倍用量；本地消息与云端聊天共用额度，可能另有每周限额；达到限额时进行中的这一轮可以做完；credits用于在达到包含额度后继续；当前限额看用量仪表板。
    teaching_use: 新增一节说明档位差别和达到限额时的实际情形，不列价格、不作购买建议。
  - fact_id: desktop-slash-entries
    url: https://learn.chatgpt.com/docs/reference/slash-commands
    locator: /status
    checked_on: '2026-09-28'
    understanding: 桌面/status显示聊天标识、上下文用量和速率限制。
    teaching_use: 作为任务内查看入口，并与账号用量页区分。
  teaching_sequence:
  - 个人菜单核对账号与工作区→几种会员差在哪里
  - 打开用量页面→先读标签再读数字→窗口与每周限额→为什么一条消息没有固定消耗
  - 任务内/status→出现限制时分清是哪一种→达到限额后的处理→怎样少花冤枉用量
  defer:
  - 模型与Fast的选择留第6章
  - 上下文用量留第13章
  case_plan: 以第4章那次任务与「把还书放第一项」的短请求对比消耗；百分比读法为示例数字。按作者2026-09-28要求补会员档位与查看额度的基础知识。
