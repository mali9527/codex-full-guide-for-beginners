    teaching_use: 教在输入区选择菜单项及分别读标签。
  teaching_sequence:
  - 已登录→个人菜单核对身份→官方用量页核对同一账号→读窗口/剩余/重置时间
  - 当前任务输入/→选择/status→分清上下文与限额→按错误种类处理
