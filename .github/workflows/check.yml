name: Check draft and requested delivery

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      units:
        description: 'Delivery unit IDs separated by spaces, or all for the whole book'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Date-only review records use the author's working timezone.
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install local check dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Test writing mechanism
        run: python -m unittest discover -s tools/tests -v
      - name: Check reader text for editorial leftovers
        run: python tools/check_reader_text.py
      - name: Check draft structure and review gaps
        run: python tools/studio.py --root . --json check
      - name: Check explicitly requested delivery
        if: github.event_name == 'workflow_dispatch'
        env:
          DELIVERY_UNITS: ${{ inputs.units }}
        run: python tools/check_delivery.py
