name: Check publication

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install local check dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Test per-unit writing evidence gate
        run: python -m unittest discover -s tools/tests -p test_writing_gate.py -v
      - name: Check reader text for editorial leftovers
        run: python tools/check_reader_text.py
      - name: Check source and publication evidence
        run: python tools/studio.py --root . --json check --publication
